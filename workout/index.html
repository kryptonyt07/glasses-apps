<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=600, height=600, initial-scale=1.0, user-scalable=no">
<title>Workout</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:600px; height:600px; overflow:hidden; background:#000; color:#fff;
    font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; }
  #app { width:600px; height:600px; display:flex; flex-direction:column; padding:22px 26px; }
  #top { flex:none; }
  #title { font-size:27px; font-weight:800; letter-spacing:1px; }
  #meta { font-size:19px; color:#8fd6e8; margin-top:2px; }
  #prog { font-size:19px; color:#FFC24B; margin-top:6px; letter-spacing:1px; }
  #list { flex:1; overflow-y:auto; margin-top:14px; padding-right:4px; }
  #list::-webkit-scrollbar { width:0; }
  .hd { font-size:15px; color:#7d8790; letter-spacing:3px; text-transform:uppercase; margin:16px 0 6px; }
  .hd:first-child { margin-top:0; }
  .it { font-size:24px; line-height:1.25; padding:8px 12px; border-radius:11px;
    border:3px solid transparent; color:#e8f6ff; }
  .it.focused { border-color:#00E5FF; background:#06232b; }
  .it.done { color:#57616a; text-decoration:line-through; }
  #foot { flex:none; margin-top:12px; padding-top:10px; border-top:2px solid #1b242b;
    font-size:18px; color:#9ef3ff; }
  #foot .hint { color:#7d8790; font-size:15px; margin-top:4px; }
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <div id="title">TODAY</div>
    <div id="meta">50 min · RPE 6&ndash;6.5 · leave 3 in tank</div>
    <div id="prog"></div>
  </div>
  <div id="list"></div>
  <div id="foot">Finish by 12:30 · protein + carbs after
    <div class="hint">look ▲▼ to move · pinch ✓ to tick off</div>
  </div>
</div>
<script>
'use strict';
// Session 2026-08-17 · 50 min · RPE 6–6.5
const BLOCKS = [
  {h:'Warm · 8 min', items:[
    'Bike 5 min · nasal only',
    'Ankle rocks 2×15',
    'Tibs 2×15',
    '90/90 ×6 / side',
    'Bridge 1×12 · 3s hold']},
  {h:'Tendon primer', items:[
    'Spanish squat / wall sit 3×35s',
    '↳ PAIN UNDER 3 or stop',
    'Tibs slow 2×20 · 2s up 2s down']},
  {h:'Power', items:['MB chest pass 2×3 (or squat jump)']},
  {h:'Lift', items:[
    'Trap bar 3×5 @ RPE 6',
    '↳ +2.5–5kg ONLY if knee was 0–1 Mon',
    'DB bench 3×8 @ RPE 6',
    'Row 3×8 · pause 1s at chest']},
  {h:'Single leg + core', items:[
    'Split squat 1×8 / side BW · 3s down',
    'Goblet squat 1×8 · 3s down @ RPE 6',
    'Pallof 2×10 / side']},
  {h:'Prehab + calf', items:[
    'Heel slides 12 / leg',
    'Quad sets 10×5s',
    'Calf raise 2×15 · 3s up 2s hold 3s down',
    'Soleus raise 1×15 · knees bent',
    'Balance 30s / side']},
  {h:'Cool · 3 min', items:[
    'Couch hip flexor 60s / side',
    'Calf wall 45s / side']},
];
const ALL = BLOCKS.flatMap(b => b.items);
const KEY = 'wo:done:' + new Date().toISOString().slice(0,10);
let done = {};
try { done = JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e){}
let idx = 0;

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function render(){
  let h = '', k = 0;
  for (const b of BLOCKS){
    h += '<div class="hd">'+esc(b.h)+'</div>';
    for (const it of b.items){
      const i = k++;
      h += '<div class="it'+(i===idx?' focused':'')+(done[i]?' done':'')+'" data-i="'+i+'">'+esc(it)+'</div>';
    }
  }
  document.getElementById('list').innerHTML = h;
  const n = ALL.filter((_,i)=>done[i]).length;
  document.getElementById('prog').textContent = n + ' / ' + ALL.length + ' done' + (n===ALL.length ? '  ✓ all clear' : '');
  const el = document.querySelector('.it.focused');
  if (el) el.scrollIntoView({block:'nearest'});
}

document.addEventListener('keydown', (e)=>{
  if (e.key==='ArrowDown'){ idx = (idx+1)%ALL.length; render(); }
  else if (e.key==='ArrowUp'){ idx = (idx-1+ALL.length)%ALL.length; render(); }
  else if (e.key==='Enter'){
    done[idx] = !done[idx];
    localStorage.setItem(KEY, JSON.stringify(done));
    render();
  }
});

render();

// Offline support (2026-08-18, Meta v127 add-offline). Registered at the repo
// root so one worker covers every app. Failure is non-fatal: no service worker
// just means the app behaves exactly as it did before.
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('../sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
