<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Dash — Config</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#0d1117; color:#e6edf3; font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    max-width:720px; margin:0 auto; padding:24px 16px 80px; }
  h1 { font-size:22px; color:#58d6ff; margin-bottom:4px; }
  .sub { color:#8b949e; font-size:14px; margin-bottom:20px; }
  label { display:block; font-size:13px; color:#8b949e; margin:16px 0 6px; text-transform:uppercase; letter-spacing:1px; }
  textarea { width:100%; background:#161b22; color:#e6edf3; border:1px solid #30363d; border-radius:8px;
    padding:10px 12px; font-size:16px; min-height:140px; line-height:1.6; }
  button { margin-top:18px; width:100%; padding:14px; font-size:17px; font-weight:600; border:none;
    border-radius:10px; background:#1f6feb; color:#fff; }
  button.secondary { background:#21262d; color:#c9d1d9; margin-top:10px; }
  #out { display:none; margin-top:22px; padding:16px; background:#161b22; border:1px solid #238636; border-radius:10px; }
  #link { word-break:break-all; font-size:12px; color:#8b949e; background:#0d1117; padding:8px;
    border-radius:6px; margin-bottom:10px; }
</style>
</head>
<body>
<h1>Daily Dash — today's focus items</h1>
<div class="sub">One item per line, max 5 shown. Generates a link; open it once and the dash remembers.</div>
<label>Items</label>
<textarea id="src" placeholder="Sign Allied DocuSign
Katherine round-2 reply
Smoke test MV7+
Ball 6pm"></textarea>
<button id="gen">Generate dash link</button>
<div id="out">
  <div id="link"></div>
  <button id="copy" class="secondary">Copy link</button>
  <button id="open" class="secondary">Open dash</button>
</div>
<script>
'use strict';
function b64uEncode(str){
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  for (let i=0;i<bytes.length;i+=0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i,i+0x8000));
  return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
document.getElementById('gen').onclick = ()=>{
  const items = document.getElementById('src').value.split('\n').map(s=>s.trim()).filter(Boolean).slice(0,5);
  if (!items.length){ alert('Add at least one item.'); return; }
  const url = location.href.replace(/config\.html.*$/,'') + '#s=' + b64uEncode(JSON.stringify({items}));
  document.getElementById('link').textContent = url;
  document.getElementById('out').style.display = 'block';
  document.getElementById('copy').onclick = ()=>navigator.clipboard.writeText(url);
  document.getElementById('open').onclick = ()=>window.open(url,'_blank');
};
</script>
</body>
</html>
