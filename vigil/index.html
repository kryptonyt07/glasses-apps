<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#08080a">
<title>VIGIL</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;
    user-select:none;-webkit-user-select:none;}
  :root{
    --bg:#08080a; --panel:#12161d; --edge:#2a323d;
    --ink:#EDF1F6; --dim:#8b95a3; --faint:#5b6572;
    --you:#4FE8C4; --boss:#A06BFF;
    --tell:#FF4A2E; --shot:#FF6B4A; --gold:#FFC94B;
  }
  html,body{height:100%;background:var(--bg);color:var(--ink);overflow:hidden;
    font-family:ui-monospace,'SF Mono',Menlo,monospace;touch-action:none;}
  body{display:flex;align-items:center;justify-content:center;
    padding:env(safe-area-inset-top) 10px env(safe-area-inset-bottom);}
  #wrap{width:100%;max-width:460px;display:flex;flex-direction:column;gap:8px;}

  .hud{display:flex;align-items:center;justify-content:space-between;font-size:11px;
    letter-spacing:.13em;color:var(--dim);}
  .hp{display:flex;gap:5px;}
  .pip{width:13px;height:13px;border-radius:3px;background:var(--you);
    box-shadow:0 0 9px rgba(79,232,196,.5);}
  .pip.gone{background:#222831;box-shadow:none;}
  .pip.rage{background:var(--gold);box-shadow:0 0 11px rgba(255,201,75,.75);}
  .bossline{display:flex;align-items:center;gap:8px;}
  .bn{font-size:12px;letter-spacing:.15em;color:var(--boss);white-space:nowrap;}
  #bb{flex:1;height:7px;background:#161a21;border-radius:99px;overflow:hidden;}
  #bf{height:100%;background:linear-gradient(90deg,var(--boss),#C9A8FF);transition:width .3s;}

  #stage{position:relative;width:100%;aspect-ratio:1;background:#0b0e13;
    border:2px solid var(--edge);border-radius:12px;overflow:hidden;}
  canvas{display:block;width:100%;height:100%;}
  #stage.hit{animation:sh .22s;}
  @keyframes sh{0%,100%{transform:translate(0,0)}25%{transform:translate(-5px,3px)}
    50%{transform:translate(4px,-4px)}75%{transform:translate(-3px,-2px)}}

  /* menu phase */
  #menu{position:absolute;inset:0;display:none;flex-direction:column;
    align-items:center;justify-content:center;gap:9px;background:rgba(8,8,10,.9);padding:18px;}
  #menu.on{display:flex;}
  #menu .lead{font-size:11.5px;letter-spacing:.12em;color:var(--dim);margin-bottom:2px;}
  .act{width:100%;max-width:300px;padding:11px 14px;border-radius:10px;border:2px solid var(--edge);
    background:#141922;color:var(--ink);font-family:inherit;text-align:left;font-size:13.5px;}
  .act b{display:block;font-size:13px;letter-spacing:.09em;margin-bottom:1px;}
  .act span{color:var(--dim);font-size:11.5px;}
  .act.s b{color:var(--you);} .act.g b{color:#6FA8FF;} .act.u b{color:var(--gold);}

  #veil{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;
    justify-content:center;gap:10px;background:rgba(8,8,10,.96);padding:20px;text-align:center;}
  #veil.on{display:flex;}
  #veil h2{font-size:clamp(20px,5.4vw,28px);letter-spacing:.14em;}
  #veil .r{color:var(--dim);font-size:12.5px;line-height:1.7;max-width:320px;}
  #veil b{color:var(--ink);}
  .btn{padding:11px 24px;border-radius:10px;border:2px solid var(--you);color:var(--you);
    font-family:inherit;font-size:13.5px;letter-spacing:.1em;background:transparent;}
  .boon{width:100%;max-width:300px;padding:10px 13px;border-radius:10px;border:2px solid var(--edge);
    background:#141922;text-align:left;font-family:inherit;color:var(--ink);}
  .boon b{display:block;color:var(--you);font-size:12px;letter-spacing:.08em;}
  .boon span{color:var(--dim);font-size:11.5px;}

  .legend{display:flex;justify-content:center;gap:11px;flex-wrap:wrap;font-size:10px;
    color:var(--faint);letter-spacing:.03em;}
  .legend i{font-style:normal;display:inline-flex;align-items:center;gap:4px;}
  .legend .dot{width:9px;height:9px;border-radius:50%;display:inline-block;}
  .foot{display:flex;justify-content:space-between;align-items:center;gap:10px;
    font-size:10.5px;color:var(--faint);letter-spacing:.06em;}
  #mute{font-family:inherit;font-size:10.5px;letter-spacing:.06em;background:transparent;
    border:1px solid var(--edge);border-radius:6px;padding:3px 8px;color:var(--you);cursor:pointer;}
  #mute.off{color:var(--faint);}
  #mute:focus-visible{outline:2px solid var(--you);outline-offset:2px;}
</style>
</head>
<body>
<div id="wrap">
  <div class="hud"><div class="hp" id="hp"></div><div id="ph">YOUR MOVE</div></div>
  <div class="bossline"><span class="bn" id="bn">SENTRY</span><div id="bb"><div id="bf"></div></div></div>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="menu"></div>
    <div id="veil"></div>
  </div>
  <div class="legend">
    <i><span class="dot" style="background:#FF6B4A"></span>falls · sidestep</i>
    <i><span class="dot" style="background:#FFB03A"></span>bursts out · read the gap</i>
    <i><span class="dot" style="background:#A06BFF;box-shadow:0 0 0 2px #C77BFF inset"></span>hunts · circle it</i>
    <i><span class="dot" style="background:var(--you)"></span>you</i>
  </div>
  <div class="foot"><span id="sc">1 / 5</span><span id="tip">drag anywhere to move</span>
    <button id="mute" type="button" aria-label="toggle sound">♪ on</button></div>
</div>
<script>
'use strict';

// VIGIL — the Undertale hybrid. Your turn is a menu with no clock on it; the
// boss's turn is a real-time dodge phase. The join between them is the only
// idea that matters here: THE ATTACK YOU PICK SETS HOW LONG YOU HAVE TO SURVIVE.
// Strike is cheap and short, Surge is heavy and long. So the turn-based choice
// and the real-time execution are the same decision, which is the thing most
// hybrids get wrong by letting you pick a move and then dodging an unrelated
// attack.

// Fixed logical arena. Physics stay identical on a phone and a laptop; only the
// draw scale changes. Balancing against device size would be a nightmare.
const W = 400, H = 400;

// Each boss has a FORM as well as a pattern set. "Show the enemy in front of
// me" was the note, and it was right: fighting an HP bar has no character in
// it. The boss now sits in the arena, every projectile leaves ITS body, it
// flinches when hit, and it visibly enrages when you choose SURGE.
const BOSSES = [
  { name:'SENTRY', form:'eye', col:'#7BE3FF',  hp:6,  pat:['rain'],                    speed:1.00,
    tell:'The gap is never where you are standing. Read it early and commit.' },
  { name:'CHOIR', form:'triad', col:'#B98CFF',   hp:8,  pat:['ring','rain'],             speed:1.05,
    tell:'Rings bloom twice, fast then slow. One lane is open in both. Go to it.' },
  { name:'LATTICE', form:'grid', col:'#FF9BE0', hp:11, pat:['sweep','rain','spiral'],   speed:1.12,
    tell:'The beam telegraphs thin before it fires thick. That line is your warning.' },
  { name:'HOUND', form:'maw', col:'#FF8A5C',   hp:13, pat:['homing','sweep','rain'],   speed:1.18,
    tell:'Homing shots turn slowly. Circle them, never outrun them in a line.' },
  { name:'WARDEN', form:'crown', col:'#A06BFF',  hp:17, pat:['spiral','ring','sweep','homing','rain'], speed:1.25,
    tell:'Everything at once. You already know each piece.' },
];

const BOONS = [
  { k:'hp',    n:'VITALITY',   d:'+1 maximum health, healed to full.' },
  { k:'dmg',   n:'HEAVY HAND', d:'At half health or less, all damage doubles.' },
  { k:'small', n:'SLIGHT',     d:'Your hitbox shrinks. Threads needles.' },
  { k:'fast',  n:'FLEET',      d:'You move noticeably quicker.' },
  { k:'ward',  n:'WARDING',    d:'A shield each fight, absorbs one hit.' },
  { k:'brief', n:'BREVITY',    d:'Every dodge phase is one second shorter.' },
];

const ACTS = [
  // Surge does exactly DOUBLE Strike's damage per second, and it has to. When
  // the two were equally efficient the menu had a right answer: a simulated
  // dodger (tools/vigil-difficulty.js) takes ~7x the hits in a ten second phase
  // as in a five, so nobody would ever buy the long one. At 2x it clears the run
  // in 90s against Strike's 145s, and the bet is legible — half the phases, each
  // one far worse. The boss descending every phase is the thumb on the scale
  // that stops the safe grind being free.
  { k:'strike', n:'STRIKE', dmg:2, secs:5.0,  cls:'s', d:'2 damage · 5s · it shrugs this off' },
  { k:'guard',  n:'GUARD',  dmg:0, secs:5.0,  cls:'g', d:'no damage · 5s · shield, but it CLOSES IN' },
  { k:'surge',  n:'SURGE',  dmg:8, secs:10.0, cls:'u', d:'8 damage · 10s · ENRAGES it' },
];

const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
const stageEl=document.getElementById('stage'), menuEl=document.getElementById('menu');
const veil=document.getElementById('veil'), hpEl=document.getElementById('hp');
const phEl=document.getElementById('ph'), bnEl=document.getElementById('bn');
const bfEl=document.getElementById('bf'), scEl=document.getElementById('sc');
const tipEl=document.getElementById('tip');

let boss, stage, hp, maxHp, shield, bossHp, boons, deaths, runStart;
let px, py, bullets, beams, phaseEnd, running, iframeUntil, lastT;
let bx, by, bFlinch, bRage, bDying, parts;
// The boss DRIFTS. A stationary emitter produces stationary answers: every ring
// leaves the same corridors, every rain volley fans the same way, so one spot
// survives the whole phase. Moving the origin means the geometry never repeats,
// which is what actually kills camping — the pattern fixes below only widen the
// coverage, the drift is what stops it being the same coverage twice.
let drift=0;
function stepBoss(dt){
  drift += dt*(bRage?0.95:0.62);
  bx = W/2 + Math.sin(drift)*W*(bRage?0.32:0.26) + Math.sin(drift*2.31)*W*0.06;
  bx = Math.max(64, Math.min(W-64, bx));
}
deaths=parseInt(localStorage.getItem('vigil:deaths')||'0',10);
const has=k=>boons.includes(k);
const PR=()=> has('small') ? 4.5 : 6.5;          // hitbox radius

// THE BOX. Undertale's actual idea, and the fix for "the first four bosses all
// have spots where you don't have to move". A prober (tools/vigil-safespots.js)
// put a player who never moves on every cell of the arena and found 64% of
// SENTRY's board was NEVER contested: rain fell from the boss downward, so
// everything level with or above it was a permanent seat.
//
// Rather than inventing attacks to spray at dead space, the dead space is gone.
// The boss sits in an alcove; you fight in a box beneath it. This is also what
// finally gives GUARD a price you can see. "It closes in" used to be a line of
// text. Now the boss descends and the ceiling of your box comes down with it,
// so guarding literally costs you floor.
const BOX_PAD = 52;
// It descends every single phase, whatever you picked. This is the pressure the
// fight was missing: with only HP at stake, chipping away with the cheap short
// attack was strictly correct and the menu had a right answer. Now grinding
// costs you the room you grind in — nine STRIKEs at the WARDEN leaves you
// fighting in a slot, four SURGEs leaves you most of the board. That is the
// actual trade, and you can watch it happen.
const BY_MAX = 200;
const DESCENT = 9;
const boxTop = () => by + BOX_PAD;
function clampPlayer(){
  const r=PR();
  px=Math.max(r,Math.min(W-r,px));
  py=Math.max(boxTop()+r,Math.min(H-r,py));
}
const SPD=()=> has('fast') ? 1.45 : 1.0;

// ── audio ───────────────────────────────────────────────────────────────────
// Rewritten 2026-08-18. The first version drove the sequence with a chain of
// setTimeout calls and tore the whole thing down and rebuilt it on every phase
// change, which is exactly what "the sound is broken, it turns on and off
// repeatedly" describes: setTimeout drifts by tens of milliseconds under load
// (and a busy bullet-hell frame IS load), and stopping the sequencer between
// every menu and every dodge phase restarted the figure from bar one every few
// seconds.
//
// This is the standard WebAudio answer instead: ONE transport that starts on
// the first note and never stops for the rest of the run, and a scheduler that
// runs on a coarse 25ms interval but places every event on the audio clock
// ahead of time, so timing is sample-accurate and immune to frame hitches.
// Changing phase now changes tempo and voicing on a transport that keeps
// counting, so the fight music is audibly the SAME piece getting urgent.
let ac=null, master=null, muted=false, transport=null;
let step16=0, nextAt=0, mMode='calm', nbuf=null;
try{ muted = localStorage.getItem('vigil:muted')==='1'; }catch(_){}

function actx(){
  if(!ac){
    try{
      ac=new (window.AudioContext||window.webkitAudioContext)();
      master=ac.createGain(); master.gain.value=muted?0:0.85; master.connect(ac.destination);
    }catch(e){ ac=null; }
  }
  if(ac && ac.state==='suspended') ac.resume();
  return ac;
}
function noiseBuf(c){
  if(!nbuf){
    const n=c.sampleRate*1.0; nbuf=c.createBuffer(1,n,c.sampleRate);
    const ch=nbuf.getChannelData(0);
    for(let i=0;i<n;i++) ch[i]=Math.random()*2-1;
  }
  return nbuf;
}
function tone(f,d,type,v,when){
  const c=actx(); if(!c) return;
  const t0=(when||c.currentTime);
  const o=c.createOscillator(), g=c.createGain();
  o.type=type||'square'; o.frequency.setValueAtTime(f,t0);
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(Math.max(.0002,v==null?.045:v),t0+0.008);
  g.gain.exponentialRampToValueAtTime(.0001,t0+d);
  o.connect(g); g.connect(master||c.destination); o.start(t0); o.stop(t0+d+.02);
}
// ── the kit ─────────────────────────────────────────────────────────────────
// Synthesised, not sampled, for the same reason as the melody: no files means
// no load, and it means the beat can bend with the fight.
function kick(t0,v){
  const c=actx(); if(!c) return;
  const o=c.createOscillator(), g=c.createGain();
  o.type='sine';
  o.frequency.setValueAtTime(165,t0);
  o.frequency.exponentialRampToValueAtTime(42,t0+0.10);
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(v||.55,t0+0.006);
  g.gain.exponentialRampToValueAtTime(.0001,t0+0.22);
  o.connect(g); g.connect(master); o.start(t0); o.stop(t0+0.24);
}
function snare(t0,v){
  const c=actx(); if(!c) return;
  const src=c.createBufferSource(); src.buffer=noiseBuf(c); src.loop=true;
  const hp=c.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=1500;
  const g=c.createGain();
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(v||.16,t0+0.004);
  g.gain.exponentialRampToValueAtTime(.0001,t0+0.13);
  src.connect(hp); hp.connect(g); g.connect(master);
  src.start(t0); src.stop(t0+0.15);
  // a little body under the hiss, or it reads as a click rather than a hit
  const o=c.createOscillator(), og=c.createGain();
  o.type='triangle'; o.frequency.setValueAtTime(196,t0);
  og.gain.setValueAtTime(0.0001,t0);
  og.gain.exponentialRampToValueAtTime((v||.16)*0.5,t0+0.004);
  og.gain.exponentialRampToValueAtTime(.0001,t0+0.09);
  o.connect(og); og.connect(master); o.start(t0); o.stop(t0+0.11);
}
function hat(t0,v,open){
  const c=actx(); if(!c) return;
  const src=c.createBufferSource(); src.buffer=noiseBuf(c); src.loop=true;
  const hp=c.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=7200;
  const g=c.createGain(); const d=open?0.14:0.035;
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(v||.055,t0+0.002);
  g.gain.exponentialRampToValueAtTime(.0001,t0+d);
  src.connect(hp); hp.connect(g); g.connect(master);
  src.start(t0); src.stop(t0+d+0.02);
}
// impact noise, kept from the old engine because the hit and the kill need a
// crunch under the tone. Same shared buffer as the kit.
function noise(d,v){
  const c=actx(); if(!c) return;
  const t0=c.currentTime;
  const src=c.createBufferSource(); src.buffer=noiseBuf(c); src.loop=true;
  const lp=c.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=1600;
  const g=c.createGain();
  g.gain.setValueAtTime(Math.max(.0002,v||.08),t0);
  g.gain.exponentialRampToValueAtTime(.0001,t0+d);
  src.connect(lp); lp.connect(g); g.connect(master);
  src.start(t0); src.stop(t0+d+.02);
}
function beep(f,d,t,v){ tone(f,d,t,v); }

// A two-bar minor figure over a kit. Same notes in both modes; tempo, voicing
// and how hard the drums work are what change, so the transition reads as the
// same music getting urgent rather than a different track starting.
const SCALE=[110,130.81,146.83,164.81,196,220,261.63,293.66];
const FIG=[0,2,4,2,5,4,2,0, 0,3,5,3,6,5,3,0];
const BPM={calm:84, fight:150, off:110};
function sixteenth(){ return 60/BPM[mMode]/4; }

function playStep(i16, t0){
  if(mMode==='off') return;
  const fast = mMode==='fight';
  const i = i16 % FIG.length;
  const root = SCALE[FIG[i]];
  // bass + lead
  if(i%4===0) tone(root/2, fast?.26:.46, 'triangle', fast?.05:.032, t0);
  if(fast || i%2===0) tone(root*2, fast?.09:.15, 'square', fast?.02:.012, t0);
  // kit: a half-time pulse when you are choosing, a driving beat when you are
  // being shot at. The backbeat is the thing your ears lock onto, so it stays
  // on 4 and 12 in both and only the density around it moves.
  const b=i%16;
  if(fast){
    if(b===0||b===6||b===10) kick(t0, b===0?.6:.42);
    if(b===4||b===12) snare(t0,.17);
    if(b%2===0) hat(t0, b%4===0?.05:.035, b===14);
    if(b===15) snare(t0,.09);
  } else {
    if(b===0) kick(t0,.4);
    if(b===8) kick(t0,.26);
    if(b===12) snare(t0,.09);
    if(b%4===0) hat(t0,.026);
  }
}

function scheduler(){
  const c=actx(); if(!c) return;
  if(nextAt < c.currentTime) nextAt = c.currentTime + 0.05;
  while(nextAt < c.currentTime + 0.12){
    playStep(step16, nextAt);
    nextAt += sixteenth();
    step16++;
  }
}
// mode only retunes a transport that keeps running; it never restarts it
function music(mode){
  mMode = mode;
  const c=actx(); if(!c) return;
  if(!transport){ nextAt=c.currentTime+0.06; transport=setInterval(scheduler,25); scheduler(); }
}
function setMuted(m){
  muted=m;
  try{ localStorage.setItem('vigil:muted', m?'1':'0'); }catch(_){}
  if(master && ac){
    master.gain.cancelScheduledValues(ac.currentTime);
    master.gain.setTargetAtTime(m?0:0.85, ac.currentTime, 0.02);
  }
  const b=document.getElementById('mute');
  if(b){ b.textContent = m?'♪ off':'♪ on'; b.classList.toggle('off', m); }
}

function fit(){
  const r=Math.min(window.devicePixelRatio||1,2);
  cv.width=W*r; cv.height=H*r; ctx.setTransform(r,0,0,r,0,0);
}

// ── input: RELATIVE drag ────────────────────────────────────────────────────
// Absolute "player teleports to your finger" is the obvious choice and it is
// wrong on a phone: your thumb sits on top of the one thing you need to see.
// Relative drag keeps the player visible and gives finer control.
let dragging=false, lastX=0, lastY=0;
function toLocal(e){
  const r=cv.getBoundingClientRect();
  return [(e.clientX-r.left)*(W/r.width), (e.clientY-r.top)*(H/r.height)];
}
let hasDragged=false;
cv.addEventListener('pointerdown',e=>{
  if(!hasDragged){ hasDragged=true; try{localStorage.setItem('vigil:dragged','1');}catch(_){}
    const t=document.getElementById('tip'); if(t) t.textContent='that is it'; }
  cv.setPointerCapture(e.pointerId); dragging=true;
  [lastX,lastY]=toLocal(e); e.preventDefault();
});
cv.addEventListener('pointermove',e=>{
  if(!dragging||(!running&&!attract))return;
  const [x,y]=toLocal(e);
  px+=(x-lastX)*SPD(); py+=(y-lastY)*SPD(); clampPlayer();
  lastX=x; lastY=y; e.preventDefault();
});
['pointerup','pointercancel'].forEach(t=>cv.addEventListener(t,()=>{dragging=false;}));
// keyboard for the laptop
const keys={};
document.addEventListener('keydown',e=>{
  keys[e.key]=true;
  if(!running){
    const b=veil.classList.contains('on')?veil.querySelector('.btn,.boon'):null;
    if(b&&(e.key==='Enter'||e.key===' ')){b.click();e.preventDefault();}
  }
});
document.addEventListener('keyup',e=>{keys[e.key]=false;});

// Sound off has to be one tap, not a menu. M on a laptop, the ♪ under the board
// on a phone, and the choice survives a reload.
const muteBtn=document.getElementById('mute');
if(muteBtn) muteBtn.onclick=()=>{ setMuted(!muted); muteBtn.blur(); };
document.addEventListener('keydown',e=>{ if(e.key==='m'||e.key==='M') setMuted(!muted); });
setMuted(muted);

// ── patterns ────────────────────────────────────────────────────────────────
// Every attack TELEGRAPHS. That is the one rule carried over from the grid
// version and it is what makes dying feel like your fault rather than the
// game's. Nothing spawns already lethal.
function shot(x,y,vx,vy,r,kind){ bullets.push({x,y,vx,vy,r:r||5,kind:kind||'straight',born:performance.now()}); }

function emit(kind, t, sp){
  const R=Math.random;
  if(kind==='rain'){
    // The gap is placed in the half of the box FURTHEST from you most of the
    // time. A uniformly random gap lands under your feet often enough that
    // standing still was a live strategy; now every volley is a commute.
    const far = px < W/2 ? [W*0.52, W-70] : [70, W*0.48];
    const gap = R()<0.72 ? far[0]+R()*(far[1]-far[0]) : 60+R()*(W-120);
    // The column phase JITTERS per volley. On a fixed 34px lattice the strip
    // just under the ceiling was still free, because up there the columns have
    // not splayed yet and the 17px between two of them is wider than you are.
    // Fixed columns mean fixed lanes; shifting them means no lane persists.
    const x0=12+R()*34;
    for(let x=x0;x<W;x+=34){
      if(Math.abs(x-gap)<46) continue;           // a real gap, always
      // Splay TAPERS to nothing at the walls. With a flat splay the outermost
      // columns drifted off-screen before they ever reached your level, which
      // is why both bottom corners measured as free seats.
      const off=(x-bx)/(W*0.5);
      shot(x, by+18, (x-bx)*0.16*Math.max(0,1-off*off), (70+22*sp)*sp, 5, 'rain');
    }
  } else if(kind==='ring'){
    // TWO interleaved rings at different speeds. One ring is a sieve at range:
    // 18 shots expanded to the floor of the box sit ~105px apart by the time
    // they arrive, which is an open door wherever you happen to be standing.
    // The fast ring fills the slow ring's doors. The hole is aligned in both,
    // so there is exactly one lane and you have to go and stand in it.
    const n=16, off=R()*Math.PI*2, hole=off+Math.floor(R()*n)/n*Math.PI*2;
    for(let pass=0;pass<2;pass++){
      const rot=off+pass*Math.PI/n, spd=(pass?95:64)*sp;
      for(let i=0;i<n;i++){
        const a=rot+i/n*Math.PI*2;
        const d=Math.abs(((a-hole)+Math.PI*3)%(Math.PI*2)-Math.PI);
        if(d < Math.PI/n*1.4) continue;          // the gap you aim for
        shot(bx,by,Math.cos(a)*spd,Math.sin(a)*spd,4.8,'burst');
      }
    }
  } else if(kind==='spiral'){
    // three arms, not two: two arms sweep past a static player without ever
    // sharing a radius with them.
    const a=t*2.7*(bRage?1.2:1);
    for(let k=0;k<3;k++){
      const ang=a+k*Math.PI*2/3;
      shot(bx,by,Math.cos(ang)*74*sp,Math.sin(ang)*74*sp,4.5,'burst');
    }
  } else if(kind==='homing'){
    bullets.push({x:bx,y:by,vx:0,vy:0,r:6.5,home:true,kind:'homing',spd:52*sp,born:performance.now()});
  } else if(kind==='sweep'){
    // telegraph first, fire after: a thin line, then the beam. A horizontal
    // beam is aimed INSIDE the box; it used to be able to pick a row up in the
    // alcove, where it swept empty space and cost you nothing.
    const vert=R()<.5, top=boxTop();
    const pos = vert ? 40+R()*(W-80) : top+22+R()*(H-top-44);
    beams.push({vert,pos,at:performance.now()+900,fired:0});
  }
}

function stepBullets(dt){
  const now=performance.now();
  for(const b of bullets){
    if(b.home){
      const dx=px-b.x, dy=py-b.y, m=Math.hypot(dx,dy)||1;
      // turn RATE is capped so circling always beats running. A perfect tracker
      // is unfair; a slow one is a puzzle.
      b.vx += (dx/m*b.spd - b.vx)*Math.min(1,dt*1.1);
      b.vy += (dy/m*b.spd - b.vy)*Math.min(1,dt*1.1);
    }
    b.x+=b.vx*dt; b.y+=b.vy*dt;
  }
  bullets=bullets.filter(b=> b.x>-30&&b.x<W+30&&b.y>-30&&b.y<H+30 && now-b.born<9000);
  for(const bm of beams){ if(!bm.fired && now>=bm.at){ bm.fired=now; beep(160,.12,'sawtooth',.05); } }
  beams=beams.filter(bm=> !bm.fired || now-bm.fired<260);
}

function collide(){
  if(performance.now()<iframeUntil) return false;
  const r=PR();
  for(const b of bullets) if(Math.hypot(b.x-px,b.y-py) < r+b.r-1) return true;
  for(const bm of beams){
    if(!bm.fired) continue;
    const d = bm.vert ? Math.abs(px-bm.pos) : Math.abs(py-bm.pos);
    if(d < r+9) return true;
  }
  return false;
}

function takeHit(){
  if(shield){ shield=false; beep(430,.15,'triangle',.06); }
  else { hp--; beep(100,.22,'sawtooth',.08); }
  iframeUntil=performance.now()+900;           // generous i-frames, bullet-hell standard
  burstParts(px,py,'#FF4A2E',14);
  stageEl.classList.add('hit');
  setTimeout(()=>stageEl.classList.remove('hit'),220);
  paintHud();
}

// ── loop ────────────────────────────────────────────────────────────────────
function frame(now){
  if(!running) return;
  const dt=Math.min(.05,(now-lastT)/1000); lastT=now;
  const t=(now-(phaseEnd-curSecs*1000))/1000;

  // keyboard movement
  const k=265*SPD()*dt;
  if(keys.ArrowLeft) px-=k;
  if(keys.ArrowRight)px+=k;
  if(keys.ArrowUp)   py-=k;
  if(keys.ArrowDown) py+=k;
  clampPlayer();

  // spawn on a cadence that ramps through the phase
  // INTENSITY CURVE. A flat spawn rate made STRIKE free: three seconds was not
  // long enough for the arena to fill, so the safe option was strictly optimal
  // and SURGE was a trap. Danger is now front-loaded AND back-loaded.
  //
  //   opening burst  — every phase is dangerous from the first half second, so
  //                    a short phase is a sharp test rather than a free window
  //   mid lull       — brief breathing room, which is what makes the ramp read
  //   end ramp       — density climbs with how far through a LONG phase you are,
  //                    so Surge's last seconds are the worst of the fight
  //
  // Net effect: Strike is a burst you must actually dodge, Surge is an
  // endurance run that gets worse the longer you are in it. Same total damage
  // per second, completely different risk shape. That is the decision.
  stepBoss(dt);
  spawnAcc+=dt;
  const prog = Math.min(1, t/curSecs);
  const open = Math.max(0, 1 - t/1.15);           // hard for the first ~1.15s
  // CAPPED. This used to be curSecs/3, which is fine at 3s and lethal nonsense
  // at 10: the final second of a Surge would have emitted ~14 volleys a second.
  // The ceiling keeps a long phase the worst one without making it a coin flip.
  const ramp = Math.pow(prog, 1.7) * Math.min(2.0, 0.55 + curSecs*0.15);
  const intensity = (1 + open*2.2 + ramp*1.15) * (bRage?1.22:1);
  const rate = 0.42 / (boss.speed * intensity);
  if(spawnAcc>rate){
    spawnAcc=0;
    emit(boss.pat[Math.floor(Math.random()*boss.pat.length)], t, boss.speed);
  }

  stepBullets(dt);
  if(collide()) takeHit();
  draw(t);

  if(hp<=0) return endRun(false);
  if(now>=phaseEnd) return endPhase();
  requestAnimationFrame(frame);
}

function drawBoss(now){
  if(bDying>0){
    // death: it comes apart. A boss that simply vanishes has no payoff.
    const k=Math.min(1,(now-bDying)/900);
    ctx.globalAlpha=1-k;
    for(let i=0;i<14;i++){
      const a=i/14*Math.PI*2, d=k*150;
      ctx.fillStyle=boss.col;
      ctx.beginPath(); ctx.arc(bx+Math.cos(a)*d, by+Math.sin(a)*d, 7*(1-k), 0, 7); ctx.fill();
    }
    ctx.globalAlpha=1; return;
  }
  const bob=Math.sin(now/620)*5;
  const y=by+bob;
  const hurt=now<bFlinch;
  const r=30 + (bRage?5:0) + (hurt?4:0);
  ctx.save();
  ctx.translate(bx,y);
  // rage reads as heat: it grows and shifts red when you chose SURGE
  ctx.fillStyle = hurt ? '#FFFFFF' : (bRage ? '#FF6B6B' : boss.col);
  ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = bRage?26:14;
  const f=boss.form;
  if(f==='eye'){
    ctx.beginPath(); ctx.ellipse(0,0,r,r*0.62,0,0,7); ctx.fill();
    ctx.shadowBlur=0; ctx.fillStyle='#08080a';
    ctx.beginPath(); ctx.arc(0,0,r*0.28,0,7); ctx.fill();
  } else if(f==='triad'){
    for(let i=0;i<3;i++){ const a=now/900+i/3*Math.PI*2;
      ctx.beginPath(); ctx.arc(Math.cos(a)*r*0.6,Math.sin(a)*r*0.6,r*0.42,0,7); ctx.fill(); }
  } else if(f==='grid'){
    ctx.beginPath();
    for(let i=0;i<4;i++){ const a=now/1100+i/4*Math.PI*2;
      ctx.rect(Math.cos(a)*r*0.55-8, Math.sin(a)*r*0.55-8, 16,16); }
    ctx.fill();
    ctx.beginPath(); ctx.arc(0,0,r*0.3,0,7); ctx.fill();
  } else if(f==='maw'){
    const open=0.35+0.25*Math.sin(now/300);
    ctx.beginPath(); ctx.arc(0,0,r,open,Math.PI*2-open); ctx.lineTo(0,0); ctx.fill();
  } else {
    ctx.beginPath();
    for(let i=0;i<7;i++){ const a=-Math.PI/2+i/7*Math.PI*2;
      ctx.lineTo(Math.cos(a)*r, Math.sin(a)*r);
      const b=a+Math.PI/7; ctx.lineTo(Math.cos(b)*r*0.45, Math.sin(b)*r*0.45); }
    ctx.closePath(); ctx.fill();
  }
  ctx.restore(); ctx.shadowBlur=0;
}

function drawParts(now){
  for(const p of parts){ const k=(now-p.t)/460; if(k>1) continue;
    ctx.globalAlpha=1-k; ctx.fillStyle=p.c;
    ctx.beginPath(); ctx.arc(p.x+p.vx*k*46, p.y+p.vy*k*46, 3.5*(1-k), 0, 7); ctx.fill(); }
  ctx.globalAlpha=1;
  parts=parts.filter(p=>now-p.t<460);
}
function burstParts(x,y,c,n){
  const now=performance.now();
  for(let i=0;i<(n||10);i++){ const a=Math.random()*7;
    parts.push({x,y,vx:Math.cos(a)*(1+Math.random()*2),vy:Math.sin(a)*(1+Math.random()*2),c,t:now}); }
}

// The box has to be VISIBLE or the ceiling coming down after a GUARD is just a
// wall you bump into. Corner ticks rather than a full frame: it reads as a
// container without competing with the bullets for attention.
function drawBox(){
  const bt=boxTop();
  ctx.fillStyle='rgba(122,140,170,0.028)'; ctx.fillRect(0,bt,W,H-bt);
  ctx.strokeStyle = bRage ? 'rgba(255,107,107,.42)' : 'rgba(160,107,255,.30)';
  ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(0,bt+0.5); ctx.lineTo(W,bt+0.5); ctx.stroke();
  ctx.strokeStyle = bRage ? 'rgba(255,107,107,.85)' : 'rgba(160,107,255,.7)';
  ctx.lineWidth=2.5;
  for(const x of [0,W]){
    const d=x?-1:1;
    ctx.beginPath(); ctx.moveTo(x+d*1.5,bt+22); ctx.lineTo(x+d*1.5,bt+1.5);
    ctx.lineTo(x+d*24,bt+1.5); ctx.stroke();
  }
  ctx.lineWidth=1;
}

function draw(t){
  ctx.clearRect(0,0,W,H);
  drawBox();
  drawBoss(performance.now());
  const inv = performance.now()<iframeUntil;

  for(const bm of beams){
    const now=performance.now();
    if(!bm.fired){
      const p=1-Math.max(0,(bm.at-now)/900);
      ctx.strokeStyle=`rgba(255,74,46,${.25+p*.5})`; ctx.lineWidth=1+p*3;
      ctx.beginPath();
      if(bm.vert){ctx.moveTo(bm.pos,boxTop());ctx.lineTo(bm.pos,H);}else{ctx.moveTo(0,bm.pos);ctx.lineTo(W,bm.pos);}
      ctx.stroke();
    } else {
      const a=1-(now-bm.fired)/260;
      ctx.fillStyle=`rgba(255,107,74,${a})`;
      if(bm.vert) ctx.fillRect(bm.pos-9,boxTop(),18,H-boxTop()); else ctx.fillRect(0,bm.pos-9,W,18);
    }
  }
  // Each threat is drawn as WHAT IT IS, because each wants a different response
  // and they all looked identical before. Rain is sidestepped, bursts are read
  // outward from the middle, and homing must be CIRCLED rather than outrun, so
  // it gets its own shape, colour and pulse instead of being another orange dot.
  for(const b of bullets){
    if(b.kind==='homing'){
      const pu=0.5+0.5*Math.sin(performance.now()/110);
      ctx.strokeStyle='#C77BFF'; ctx.lineWidth=2.2;
      ctx.beginPath(); ctx.arc(b.x,b.y,b.r+3+pu*2,0,7); ctx.stroke();
      ctx.fillStyle='#A06BFF';
      ctx.beginPath(); ctx.arc(b.x,b.y,b.r-1.5,0,7); ctx.fill();
    } else if(b.kind==='burst'){
      ctx.fillStyle='#FFB03A';
      ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,7); ctx.fill();
    } else {
      ctx.fillStyle='#FF6B4A';
      ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,7); ctx.fill();
    }
  }
  // player
  drawParts(performance.now());
  ctx.globalAlpha = inv ? (Math.floor(performance.now()/70)%2?0.35:1) : 1;
  ctx.fillStyle=(has('dmg')&&hp<=maxHp/2)?'#FFC94B':'#4FE8C4';
  ctx.beginPath(); ctx.arc(px,py,PR(),0,7); ctx.fill();
  ctx.globalAlpha=1;
  if(shield){ ctx.strokeStyle='#6FA8FF'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(px,py,PR()+5,0,7); ctx.stroke(); }

  // phase timer as a shrinking bar: you must know how much hell is left
  const left=Math.max(0,(phaseEnd-performance.now())/1000);
  ctx.fillStyle='#1b2029'; ctx.fillRect(0,H-5,W,5);
  ctx.fillStyle='#A06BFF'; ctx.fillRect(0,H-5,W*(left/curSecs),5);
}

// ── phases ──────────────────────────────────────────────────────────────────
let curSecs=3, spawnAcc=0;

const phaseLen = a => Math.max(1.5, a.secs*(has('brief')?0.8:1));

function showMenu(){
  running=false; phEl.textContent='YOUR MOVE';
  const berserk=has('dmg')&&hp<=maxHp/2;
  menuEl.className='on';
  const room=Math.round((H-boxTop())/(H-96-BOX_PAD)*100);
  menuEl.innerHTML='<div class="lead">'+(berserk?'BERSERK · damage doubled':'choose')+
    '<br><span style="color:'+(room<62?'var(--tell)':'var(--faint)')+'">room '+room+'%'+
    (room<100?' · it has descended':'')+'</span></div>'+
    ACTS.map((a,i)=>{
      const d=a.dmg*(berserk&&a.dmg?2:1);
      const s=phaseLen(a);
      return '<button class="act '+a.cls+'" data-i="'+i+'"><b>'+a.n+'</b><span>'+
        (a.dmg? d+' damage · ':'')+s.toFixed(1)+'s'+(a.k==='guard'?' · regain a shield':'')+'</span></button>';
    }).join('');
  menuEl.querySelectorAll('.act').forEach(el=>el.onclick=()=>{
    const a=ACTS[+el.dataset.i];
    const berserkNow=has('dmg')&&hp<=maxHp/2;
    const dmg=a.dmg*(berserkNow?2:1);
    menuEl.className='';
    // CONSEQUENCE. "Selecting your action is boring and has no consequence" was
    // the note. Each choice now visibly provokes the thing you are fighting:
    //   SURGE  enrages it. It swells, turns red, and the next phase is denser.
    //   GUARD  lets it ADVANCE. It closes in, so its shots have less travel
    //          time and the arena you dodge in is effectively smaller.
    //   STRIKE it shrugs off. Cheap, safe, and it changes nothing.
    // So the menu is no longer a spreadsheet: you are choosing how angry to
    // make it, and you can see the answer before you have to survive it.
    bRage = (a.k==='surge');
    if(a.k==='guard'){ shield=true; by=Math.min(BY_MAX, by+16); }   // on top of the per-phase descent
    strikeAnim(dmg, ()=>{
      if(bossHp<=0){ return killBoss(); }
      startPhase(phaseLen(a));
    });
  });
  paintHud();
}

function strikeAnim(dmg, done){
  running=false; phEl.textContent = dmg?'STRIKE':'GUARD';
  const t0=performance.now(), sx=px, sy=py, dur=dmg?420:260;
  (function step(now){
    const k=Math.min(1,(now-t0)/dur);
    ctx.clearRect(0,0,W,H);
    drawBoss(now);
    drawParts(now);
    if(dmg){
      // your dot lunges at it and snaps back, so the hit has a direction
      const e=k<.5 ? k*2 : (1-k)*2;
      const cx=sx+(bx-sx)*e, cy=sy+(by-sy)*e;
      ctx.fillStyle='#4FE8C4'; ctx.shadowColor='#4FE8C4'; ctx.shadowBlur=16;
      ctx.beginPath(); ctx.arc(cx,cy,PR(),0,7); ctx.fill(); ctx.shadowBlur=0;
      if(k>=.5 && bFlinch<t0){
        bossHp-=dmg; bFlinch=now+220; burstParts(bx,by,boss.col,16);
        tone(dmg>1?150:240,.16,'sawtooth',.07); noise(.09,.07);
        paintHud();
      }
    } else {
      ctx.strokeStyle='#6FA8FF'; ctx.lineWidth=2.5;
      ctx.beginPath(); ctx.arc(sx,sy,PR()+6+k*7,0,7); ctx.stroke();
      ctx.fillStyle='#4FE8C4'; ctx.beginPath(); ctx.arc(sx,sy,PR(),0,7); ctx.fill();
      if(k>=.5 && bFlinch<t0){ bFlinch=t0; tone(520,.14,'triangle',.05); paintHud(); }
    }
    if(k<1) requestAnimationFrame(step); else done();
  })(t0);
}

function killBoss(){
  running=false; bDying=performance.now(); music('off');
  tone(90,.7,'sawtooth',.08); noise(.5,.12);
  const t0=performance.now();
  (function step(now){
    ctx.clearRect(0,0,W,H); drawBoss(now); drawParts(now);
    if(now-t0<950) requestAnimationFrame(step); else clearBoss();
  })(t0);
}

function startPhase(secs){
  menuEl.className=''; phEl.textContent='SURVIVE';
  by=Math.min(BY_MAX, by+DESCENT);
  curSecs=secs; spawnAcc=0; bullets=[]; beams=[];
  px=W/2; py=H*0.72; iframeUntil=performance.now()+400;
  // Seed one volley immediately. Starting on an empty board is what let a short
  // phase be survived by standing still.
  emit(boss.pat[Math.floor(Math.random()*boss.pat.length)], 0, boss.speed);
  phaseEnd=performance.now()+secs*1000;
  running=true; lastT=performance.now(); music('fight');
  requestAnimationFrame(frame);
}

function endPhase(){
  running=false; music('calm'); bullets=[]; beams=[];
  ctx.clearRect(0,0,W,H);
  showMenu();
}

function paintHud(){
  hpEl.innerHTML='';
  const rage=has('dmg')&&hp<=maxHp/2;
  for(let i=0;i<maxHp;i++){
    const p=document.createElement('div');
    p.className='pip'+(i<hp?(rage?' rage':''):' gone'); hpEl.appendChild(p);
  }
  if(shield){const p=document.createElement('div');p.className='pip';p.style.background='#6FA8FF';hpEl.appendChild(p);}
  bnEl.textContent=boss.name; bfEl.style.width=Math.max(0,bossHp/boss.hp*100)+'%';
  scEl.textContent=(stage+1)+' / '+BOSSES.length;
}

function clearBoss(){
  running=false;
  if(stage>=BOSSES.length-1) return endRun(true);
  const pool=BOONS.filter(b=>b.k!=='hp'||maxHp<6).sort(()=>Math.random()-.5).slice(0,3);
  veil.className='on';
  veil.innerHTML='<h2 style="color:var(--you)">'+boss.name+' DOWN</h2><div class="r">Take one.</div>'+
    pool.map((b,i)=>'<button class="boon" data-i="'+i+'"><b>'+b.n+'</b><span>'+b.d+'</span></button>').join('');
  veil.querySelectorAll('.boon').forEach(el=>el.onclick=()=>{
    const b=pool[+el.dataset.i]; boons.push(b.k);
    if(b.k==='hp'){maxHp++;hp=maxHp;}
    if(b.k==='ward')shield=true;
    stage++; beginBoss();
  });
}

function endRun(won){
  running=false; music('off'); veil.className='on';
  const mins=((performance.now()-runStart)/1000).toFixed(0);
  if(won){
    veil.innerHTML='<h2 style="color:var(--you)">THE WARDEN FALLS</h2>'+
      '<div class="r">All five in <b>'+mins+'s</b>.<br>Deaths: <b>'+deaths+'</b>'+
      '<br><br>Now clear it using only SURGE.</div><button class="btn">RUN AGAIN</button>';
  }else{
    deaths++; localStorage.setItem('vigil:deaths',String(deaths));
    veil.innerHTML='<h2 style="color:var(--tell)">YOU DIED</h2>'+
      '<div class="r">Fell to <b>'+boss.name+'</b>, stage <b>'+(stage+1)+'/'+BOSSES.length+'</b>.'+
      '<br><br><b>'+boss.tell+'</b><br><br>'+
      (bossHp<=2?'It was nearly done. That is the fight.'
        :'Surge buys damage with time. Time is what killed you.')+
      '<br><br><span style="color:var(--faint)">Deaths: '+deaths+'</span></div>'+
      '<button class="btn">RUN AGAIN</button>';
  }
  veil.querySelector('.btn').onclick=newRun;
}

function beginBoss(){
  boss=BOSSES[stage]; bossHp=boss.hp;
  bx=W/2; by=96; bFlinch=0; bRage=false; bDying=0; parts=[];
  veil.className=''; bullets=[]; beams=[];
  tipEl.textContent = (()=>{ let seen=false; try{seen=localStorage.getItem('vigil:dragged')==='1';}catch(_){}
    return seen ? boss.tell.split('.')[0] : '↕ DRAG to move, do not use arrows'; })();
  showMenu();
}

function newRun(){
  stage=0; maxHp=3; hp=3; shield=false; boons=[]; runStart=performance.now();
  beginBoss();
}

// ATTRACT MODE. The first version opened on a wall of text over a black square,
// so you read ABOUT the game instead of seeing one. Now the arena is alive
// behind the title with harmless bullets and a draggable player: you learn the
// only verb in the game (drag to move) before anything can hurt you, and the
// text shrinks to the two lines that actually matter.
let attract=false;
function attractLoop(now){
  if(!attract) return;
  const dt=Math.min(.05,(now-lastT)/1000); lastT=now;
  attractAcc+=dt;
  if(attractAcc>0.55){ attractAcc=0; emit('rain',0,0.55); }
  for(const b of bullets){ b.x+=b.vx*dt; b.y+=b.vy*dt; }
  bullets=bullets.filter(b=>b.y<H+30);
  const k=265*dt;
  if(keys.ArrowLeft)px-=k; if(keys.ArrowRight)px+=k;
  if(keys.ArrowUp)py-=k;  if(keys.ArrowDown)py+=k;
  clampPlayer();
  ctx.clearRect(0,0,W,H);
  drawBox(); drawBoss(now);
  ctx.fillStyle='rgba(255,107,74,.45)';
  for(const b of bullets){ ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,7); ctx.fill(); }
  ctx.fillStyle='#4FE8C4';
  ctx.beginPath(); ctx.arc(px,py,PR(),0,7); ctx.fill();
  requestAnimationFrame(attractLoop);
}
let attractAcc=0;
function intro(){
  // running stays false, so nothing collides and nothing can kill you here,
  // but pointermove needs it to move the player. A dedicated flag instead.
  boons=[]; bullets=[]; beams=[]; px=W/2; py=H*0.72;
  attract=true; lastT=performance.now(); requestAnimationFrame(attractLoop);
  bx=W/2; by=96; bFlinch=0; bRage=false; bDying=0; parts=[]; boss=BOSSES[0];
  veil.className='on';
  veil.innerHTML='<h2>VIGIL</h2><div class="r">'+
    '<b>Drag anywhere.</b> Trackpad or thumb, not the arrow keys.<br>'+
    '<span style="color:var(--faint)">Arrows work, but dragging is far better. Try it now.</span><br><br>'+
    'You pick an attack with no timer on you. Then you survive, in real time, '+
    'for exactly as long as that attack costs. Five seconds, or ten.<br><br>'+
    'You fight inside the box under it. <b>Guard and the box shrinks.</b><br><br>'+
    '<span style="color:var(--faint)">Everything telegraphs before it fires.</span>'+
    '</div><button class="btn">BEGIN</button>';
  veil.querySelector('.btn').onclick=()=>{ attract=false; newRun(); };
}

fit(); window.addEventListener('resize',fit);
intro();
if('serviceWorker' in navigator)
  window.addEventListener('load',()=>navigator.serviceWorker.register('../sw.js').catch(()=>{}));
</script>
