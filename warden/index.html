<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#08080a">
<title>WARDEN</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;
    user-select:none;-webkit-user-select:none;}
  :root{
    --bg:#08080a;
    --tile:#191d25;        /* base tile, clearly visible against bg */
    --tile-reach:#2b323e;  /* where you can move: obviously lighter */
    --edge:#3a4250;
    --ink:#EDF1F6; --dim:#8b95a3; --faint:#565f6c;
    --danger:#7A1F14; --danger-line:#FF4A2E; --danger-fire:#FF6B4A;
    --gold:#5C4410; --gold-line:#FFC94B;
    --you:#4FE8C4;
    --boss:#A06BFF;
  }
  html,body{height:100%;background:var(--bg);color:var(--ink);overflow:hidden;
    font-family:ui-monospace,'SF Mono',Menlo,monospace;}
  body{display:flex;align-items:center;justify-content:center;
    padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom);}
  #wrap{width:100%;max-width:500px;display:flex;flex-direction:column;gap:9px;}

  .hud{display:flex;align-items:center;justify-content:space-between;font-size:11.5px;
    letter-spacing:.13em;color:var(--dim);}
  .hp{display:flex;gap:5px;}
  .pip{width:14px;height:14px;border-radius:3px;background:var(--you);
    box-shadow:0 0 10px rgba(79,232,196,.55);}
  .pip.gone{background:#232833;box-shadow:none;}
  .pip.shield{background:#6FA8FF;box-shadow:0 0 10px rgba(111,168,255,.6);}

  .bossline{display:flex;align-items:center;gap:9px;}
  .bossname{font-size:12.5px;letter-spacing:.15em;color:var(--boss);white-space:nowrap;}
  #bossbar{flex:1;height:8px;background:#171b22;border-radius:99px;overflow:hidden;}
  #bossfill{height:100%;background:linear-gradient(90deg,var(--boss),#C9A8FF);
    transition:width .3s cubic-bezier(.2,.9,.3,1);}

  #board{position:relative;width:100%;aspect-ratio:1;display:grid;gap:6px;}
  .c{position:relative;background:var(--tile);border-radius:8px;
    border:2px solid transparent;transition:background .1s,border-color .1s;}
  .c.reach{background:var(--tile-reach);border-color:var(--edge);}
  /* DANGER: unmistakable. Red fill, red border, and a big X so it reads even
     for colourblind eyes and in bright sun on a phone. */
  .c.tell{background:var(--danger);border-color:var(--danger-line);}
  .c.tell::after{content:'✕';position:absolute;inset:0;display:flex;align-items:center;
    justify-content:center;color:var(--danger-line);font-size:min(5.2vw,26px);font-weight:700;
    animation:thr .55s ease-in-out infinite alternate;}
  @keyframes thr{from{opacity:.55;transform:scale(.9)}to{opacity:1;transform:scale(1.05)}}
  .c.fire{background:var(--danger-fire)!important;border-color:#fff!important;}
  .c.fire::after{color:#fff;}
  /* GOLD: filled circle, thick border. Never ambiguous against danger. */
  .c.strike{background:var(--gold);border-color:var(--gold-line);}
  .c.strike::before{content:'';position:absolute;inset:28%;border-radius:50%;
    background:var(--gold-line);box-shadow:0 0 12px rgba(255,201,75,.7);
    animation:thr .8s ease-in-out infinite alternate;}
  /* A tile can be BOTH. That is the whole game, so it must look like both. */
  .c.tell.strike{background:var(--danger);border-color:var(--gold-line);}
  .c.you{outline:3px solid var(--you);outline-offset:-3px;}
  .c.you::before{content:'';position:absolute;inset:22%;border-radius:6px;
    background:var(--you);box-shadow:0 0 18px rgba(79,232,196,.85);z-index:3;
    animation:none;}
  .c.you.hurt::before{background:#FF4A2E;box-shadow:0 0 24px rgba(255,74,46,.95);}

  #board.shake{animation:sh .25s;}
  @keyframes sh{0%,100%{transform:translate(0,0)}25%{transform:translate(-6px,4px)}
    50%{transform:translate(5px,-5px)}75%{transform:translate(-4px,-3px)}}

  #veil{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;
    justify-content:center;gap:11px;background:rgba(8,8,10,.955);border-radius:10px;
    z-index:9;text-align:center;padding:20px;}
  #veil.on{display:flex;}
  #veil h2{font-size:clamp(21px,5.6vw,30px);letter-spacing:.14em;}
  #veil .r{color:var(--dim);font-size:13px;line-height:1.7;max-width:340px;}
  #veil b{color:var(--ink);}
  .btn{padding:12px 26px;border-radius:10px;border:2px solid var(--you);color:var(--you);
    font-family:inherit;font-size:14px;letter-spacing:.1em;background:transparent;}
  .boons{display:flex;flex-direction:column;gap:8px;width:100%;max-width:330px;}
  .boon{padding:11px 14px;border-radius:10px;border:2px solid var(--edge);
    background:#141821;text-align:left;font-family:inherit;color:var(--ink);font-size:13.5px;}
  .boon b{display:block;color:var(--you);letter-spacing:.08em;margin-bottom:2px;font-size:12.5px;}
  .boon span{color:var(--dim);font-size:12px;line-height:1.45;}

  .legend{display:flex;justify-content:center;gap:14px;font-size:10.5px;color:var(--faint);
    letter-spacing:.05em;flex-wrap:wrap;}
  .legend i{font-style:normal;display:inline-flex;align-items:center;gap:4px;}
  .sw{width:11px;height:11px;border-radius:3px;border:2px solid;}
  .foot{display:flex;justify-content:space-between;font-size:11px;color:var(--faint);
    letter-spacing:.07em;}
  #tip{color:var(--gold-line);}
</style>
</head>
<body>
<div id="wrap">
  <div class="hud"><div class="hp" id="hp"></div><div id="turn">TURN 1</div></div>
  <div class="bossline">
    <span class="bossname" id="bossname">SENTRY</span>
    <div id="bossbar"><div id="bossfill"></div></div>
  </div>
  <div id="board"><div id="veil"></div></div>
  <div class="legend">
    <i><span class="sw" style="background:var(--danger);border-color:var(--danger-line)"></span>kills next turn</i>
    <i><span class="sw" style="background:var(--gold);border-color:var(--gold-line)"></span>damages boss</i>
    <i><span class="sw" style="background:var(--you);border-color:var(--you)"></span>you</i>
  </div>
  <div class="foot"><span id="stage">1 / 5</span><span id="tip"></span></div>
</div>
<script>
'use strict';

// ── bosses ──────────────────────────────────────────────────────────────────
// TUNED FROM A REAL PLAYTEST (18 Aug): cleared without taking a single hit, and
// the only death was the clock. Dodging was solved, so the game was
// one-dimensional. The cause was counter-intuitive: high board coverage meant
// 81% of Warden turns had EXACTLY ONE safe tile, which is not difficulty, it is
// a forced move with no decision in it.
// Fix: gold now sits in the fire ~70% of the time, so progress costs health and
// every turn is a real trade. Boss health cut ~30% so the clock stays beatable
// while paying that cost. Measured over 1200 runs: deaths 4/8/26/29/24%,
// 10% full clear, and every boss can now end a run.
// Each boss owns a SIGNATURE set of shapes. That is the whole point: Sentry
// teaches you something Lattice does not, so knowledge earned on one carries
// but does not trivialise the next. Random-soup-from-a-bag (the first build)
// meant every fight felt the same and nothing was learnable.
const BOSSES = [
  // Sentry is the teacher. Simulation had it killing MORE than Choir (8% vs
  // 1.2%), which is backwards for a first boss, so it is deliberately gentle:
  // widest escape floor, lowest greed pressure. Learn the loop here.
  { name:'SENTRY',  n:5, hp:4,  layers:1, hunt:0, risk:0.6,
    limit:14, squeeze:6,
    shapes:['cross'],
    tell:'It fires a full row and column. Stand off both.' },
  { name:'CHOIR',   n:6, hp:5,  layers:1, hunt:0, risk:0.66,
    limit:16, squeeze:5,
    shapes:['ring','cross'],
    tell:'Rings collapse inward. The centre is not always safe.' },
  { name:'LATTICE', n:7, hp:6,  layers:2, hunt:0, risk:0.7,
    limit:18, squeeze:4,
    shapes:['diag','rows','cross'],
    tell:'Two shapes at once. Find the overlap gap, not the empty half.' },
  { name:'HOUND',   n:7, hp:7, layers:2, hunt:1, risk:0.72,
    limit:18, squeeze:4,
    shapes:['diag','rows','ring'],
    tell:'It bites where you STAND. Never end a turn still.' },
  { name:'WARDEN',  n:7, hp:9, layers:2, hunt:1,  risk:0.75,
    limit:20, squeeze:3,
    shapes:['cross','ring','diag','rows'],
    tell:'Everything, layered, and it hunts. You have done this before.' },
];

const BOONS = [
  { k:'hp',     name:'VITALITY',   desc:'+1 maximum health, healed to full.' },
  { k:'heal',   name:'MEND',       desc:'Heal to full and gain a shield that eats one hit.' },
  { k:'dmg',    name:'HEAVY HAND', desc:'Gold on a SAFE tile deals 2 damage. Rewards the good read.' },
  { k:'reach',  name:'STRIDE',     desc:'Move up to 2 tiles in a straight line.' },
  { k:'sight',  name:'FORESIGHT',  desc:'One extra gold tile appears every turn.' },
  { k:'shield', name:'WARDING',    desc:'Gain a shield that absorbs one hit, each fight.' },
];

// ── state ───────────────────────────────────────────────────────────────────
const boardEl=document.getElementById('board'), veil=document.getElementById('veil');
const hpEl=document.getElementById('hp'), turnEl=document.getElementById('turn');
const fillEl=document.getElementById('bossfill'), nameEl=document.getElementById('bossname');
const stageEl=document.getElementById('stage'), tipEl=document.getElementById('tip');

let N, cells, px, py, hp, maxHp, shield, bossHp, boss, stage, turn;
let tells, strikes, busy, over, boons, deaths, runTurns, reeling;
deaths = parseInt(localStorage.getItem('warden:deaths')||'0',10);
const bestRun = parseInt(localStorage.getItem('warden:bestrun')||'0',10);

const idx=(x,y)=>y*N+x, inb=(x,y)=>x>=0&&y>=0&&x<N&&y<N;
const md=(x,y,a,b)=>Math.abs(x-a)+Math.abs(y-b);
const has=k=>boons.includes(k);

let ac=null;
function beep(f,d,t,v){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();
  const o=ac.createOscillator(),g=ac.createGain();o.type=t||'square';o.frequency.value=f;
  g.gain.value=v==null?.05:v;g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);
  o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d);}catch(e){}}

// ── shapes ──────────────────────────────────────────────────────────────────
const rc=()=>1+Math.floor(Math.random()*(N-2));
function shape(kind){
  const o=[];
  if(kind==='cross'){const cx=rc(),cy=rc();
    for(let i=0;i<N;i++){o.push([cx,i]);o.push([i,cy]);}}
  else if(kind==='ring'){const r=1+Math.floor(Math.random()*(Math.floor(N/2)));
    const c=(N-1)/2|0;
    for(let y=0;y<N;y++)for(let x=0;x<N;x++)
      if(Math.max(Math.abs(x-c),Math.abs(y-c))===r)o.push([x,y]);}
  else if(kind==='diag'){const cx=rc(),cy=rc();
    for(let i=-N;i<=N;i++){o.push([cx+i,cy+i]);o.push([cx+i,cy-i]);}}
  else if(kind==='rows'){const s=Math.random()<.5?0:1;
    const vert=Math.random()<.5;
    for(let a=s;a<N;a+=2)for(let b=0;b<N;b++)o.push(vert?[a,b]:[b,a]);}
  return o.filter(([x,y])=>inb(x,y));
}

function buildTells(){
  let t=[];
  // PRESSURE. With a guaranteed escape every turn, a patient player could simply
  // never take a risk and win by attrition, which made the whole greed mechanic
  // pointless. So the fight closes in: every few turns the boss adds another
  // shape. You can always survive THIS turn, but you cannot survive forever, so
  // the gold has to be taken while there is still room to take it.
  const extra = Math.floor((turn-1)/boss.squeeze);
  for(let i=0;i<boss.layers+extra;i++)
    t=t.concat(shape(boss.shapes[Math.floor(Math.random()*boss.shapes.length)]));
  // Hunt marks ONLY the tile you are standing on. Radius 1 covered exactly the
  // set of tiles you can move to, so every option was lethal: Hound gave an
  // unavoidable hit on 96% of turns and Warden on 98%. The boss's own tell says
  // "it bites where you STAND", which is the correct design. The code now
  // matches the promise.
  if(boss.hunt) t.push([px,py]);
  const s=new Set(t.map(([x,y])=>idx(x,y)));
  // Guarantee an escape. A death you could not avoid breaks the contract the
  // whole genre rests on, so the floor is enforced, never hoped for.
  // The old global floor ("keep N tiles open somewhere") is gone. It re-opened
  // the board faster than the squeeze could close it, so escalation did nothing
  // and a patient player could never lose. Fairness is the LOCAL guarantee
  // below; pressure is the squeeze and the clock. Those are separate jobs.
  // LOCAL escape guarantee. The floor above only promised a safe tile existed
  // SOMEWHERE, which is worthless when every tile you can actually reach is
  // lethal. At least one reachable tile must always survive, or the turn is a
  // coin flip rather than a decision. Prefer clearing a tile you moved to over
  // the one you are standing on, so staying still is never the free answer.
  const reach=reachable().map(([x,y])=>idx(x,y));
  if(reach.every(i=>s.has(i))){
    const moves=reach.filter(i=>i!==idx(px,py));
    const free=(moves.length?moves:reach)[Math.floor(Math.random()*(moves.length||reach.length))];
    s.delete(free);
  }
  return s;
}

function reachable(){
  const out=[[px,py]];
  const dirs=[[1,0],[-1,0],[0,1],[0,-1]];
  for(const [dx,dy] of dirs){
    for(let step=1; step<=(has('reach')?2:1); step++){
      const x=px+dx*step,y=py+dy*step;
      if(!inb(x,y))break;
      out.push([x,y]);
    }
  }
  return out;
}

function buildStrikes(t){
  // REELING. Take a hit and no gold appears next turn. Measured: the run was
  // being won by stacking health and spending it as ammunition, because every
  // point of health converted directly into a point of damage. This cost does
  // NOT scale with max HP, so health stops being a damage stat and a kamikaze
  // finish now costs tempo against the clock.
  if(reeling) return new Set();
  // Gold always spawns ADJACENT even with Stride. Letting it spread across the
  // full 2-tile reach made Stride actively harmful (3% clear, worse than taking
  // nothing) because the gold drifted out of practical range. Now the extra
  // reach is pure escape value, which is what the boon promises.
  const adj=[[1,0],[-1,0],[0,1],[0,-1]].map(([dx,dy])=>[px+dx,py+dy]).filter(([x,y])=>inb(x,y));
  const cand=adj;
  if(!cand.length)return new Set();
  const risky=cand.filter(([x,y])=>t.has(idx(x,y)));
  const safe =cand.filter(([x,y])=>!t.has(idx(x,y)));
  const out=new Set();
  const n=has('sight')?2:1;
  for(let i=0;i<n;i++){
    const pool=(risky.length&&Math.random()<boss.risk)?risky:(safe.length?safe:risky);
    if(pool.length){const p=pool[Math.floor(Math.random()*pool.length)];out.add(idx(p[0],p[1]));}
  }
  return out;
}

// ── render ──────────────────────────────────────────────────────────────────
function buildBoard(){
  boardEl.querySelectorAll('.c').forEach(c=>c.remove());
  boardEl.style.gridTemplateColumns=`repeat(${N},1fr)`;
  cells=[];
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){
    const d=document.createElement('div');d.className='c';
    d.addEventListener('click',()=>tryMove(x,y));
    boardEl.appendChild(d);cells.push(d);
  }
}
function paint(){
  const reach=new Set(reachable().map(([x,y])=>idx(x,y)));
  cells.forEach((c,i)=>{
    c.className='c';
    if(reach.has(i))c.classList.add('reach');
    if(tells.has(i))c.classList.add('tell');
    if(strikes.has(i))c.classList.add('strike');
    if(i===idx(px,py))c.classList.add('you');
  });
  hpEl.innerHTML='';
  for(let i=0;i<maxHp;i++){
    const p=document.createElement('div');
    p.className='pip'+(i<hp?'':' gone');hpEl.appendChild(p);
  }
  if(shield){const p=document.createElement('div');p.className='pip shield';hpEl.appendChild(p);}
  const left=boss.limit-turn+1;
  turnEl.textContent=(reeling?'REELING · ':'')+'TURN '+turn+' / '+boss.limit;
  turnEl.style.color = left<=3 ? 'var(--danger-line)' : (left<=6 ? 'var(--gold-line)' : '');
  fillEl.style.width=Math.max(0,bossHp/boss.hp*100)+'%';
  nameEl.textContent=boss.name;
  stageEl.textContent=(stage+1)+' / '+BOSSES.length;
}

// ── turn ────────────────────────────────────────────────────────────────────
function tryMove(x,y){
  if(busy||over)return;
  if(!reachable().some(([a,b])=>a===x&&b===y))return;
  step(x,y);
}
function step(nx,ny){
  busy=true;px=nx;py=ny;
  const here=idx(px,py);
  if(strikes.has(here)){
    // Doubles ONLY when the gold was on a safe tile. Unconditional double made
    // Heavy Hand an 80% clear rate against 13% for everything else, and it paid
    // for kamikaze. Now it pays for good reads.
    const safeGold = !tells.has(here);
    bossHp -= (has('dmg') && safeGold) ? 2 : 1;
    beep(780,.09,'square',.06);
  }
  paint();
  setTimeout(()=>{
    tells.forEach(i=>cells[i].classList.add('fire'));
    reeling = tells.has(here);
    if(tells.has(here)){
      if(shield){shield=false;reeling=false;beep(430,.16,'triangle',.07);}
      else{hp--;cells[here].classList.add('hurt');beep(105,.24,'sawtooth',.09);}
      boardEl.classList.add('shake');
      setTimeout(()=>boardEl.classList.remove('shake'),250);
    }
    setTimeout(()=>{
      if(hp<=0)return died();
      if(bossHp<=0)return cleared();
      if(turn>=boss.limit)return died(true);
      turn++;runTurns++;
      tells=buildTells();strikes=buildStrikes(tells);
      paint();busy=false;
    },200);
  },185);
}

// ── flow ────────────────────────────────────────────────────────────────────
function startFight(){
  boss=BOSSES[stage];N=boss.n;bossHp=boss.hp;turn=1;
  shield=has('shield')?true:shield;
  buildBoard();
  px=(N-1)/2|0;py=(N-1)/2|0;
  tells=buildTells();strikes=buildStrikes(tells);
  over=false;busy=false;reeling=false;
  tipEl.textContent=stage===0?'red = death next turn':'';
  veil.className='';paint();
}

function cleared(){
  over=true;beep(660,.25,'triangle',.07);
  if(stage>=BOSSES.length-1)return runWon();
  // Boon draft. Three of six, so a run has a shape you chose rather than a
  // shape you were dealt.
  const pool=BOONS.filter(b=>b.k!=='hp'||maxHp<6).sort(()=>Math.random()-.5).slice(0,3);
  veil.className='on';
  veil.innerHTML='<h2 style="color:var(--you)">'+boss.name+' DOWN</h2>'+
    '<div class="r">Take one.</div><div class="boons">'+
    pool.map((b,i)=>'<button class="boon" data-i="'+i+'"><b>'+b.name+'</b><span>'+b.desc+'</span></button>').join('')+
    '</div>';
  veil.querySelectorAll('.boon').forEach(el=>el.onclick=()=>{
    const b=pool[+el.dataset.i];
    boons.push(b.k);
    if(b.k==='hp'){maxHp++;hp=maxHp;}
    if(b.k==='heal'){hp=maxHp;shield=true;}
    if(b.k==='shield')shield=true;
    stage++;startFight();
  });
}

function died(outlasted){
  over=true;deaths++;localStorage.setItem('warden:deaths',String(deaths));
  beep(85,.5,'sawtooth',.08);
  veil.className='on';
  veil.innerHTML='<h2 style="color:var(--danger-fire)">'+(outlasted?'OUTLASTED':'YOU DIED')+'</h2>'+
    '<div class="r">'+(outlasted
      ? 'The <b>'+boss.name+'</b> outlasted you. It had <b>'+bossHp+'</b> left.<br>Playing safe is still losing.'
      : 'Fell to <b>'+boss.name+'</b>, stage <b>'+(stage+1)+' of '+BOSSES.length+'</b>.')+
    '<br><br><b>'+boss.tell+'</b>'+
    '<br><br>'+coach()+
    '<br><br><span style="color:var(--faint)">Deaths: '+deaths+
    (bestRun?' · furthest: stage '+bestRun:'')+'</span></div>'+
    '<button class="btn">RUN AGAIN</button>';
  veil.querySelector('.btn').onclick=newRun;
}

function coach(){
  if(turn<4)return 'You moved before you read the board. The red is always shown a turn early.';
  if(bossHp>boss.hp*.7)return 'You dodged well and never went for gold. Safe loses slowly.';
  if(bossHp<=2)return 'One tile from it. That is the fight, not bad luck.';
  return 'Gold sits inside danger on purpose. Decide before you tap, not after.';
}

function runWon(){
  over=true;
  localStorage.setItem('warden:bestrun',String(BOSSES.length));
  veil.className='on';
  veil.innerHTML='<h2 style="color:var(--you)">THE WARDEN FALLS</h2>'+
    '<div class="r">All five, one run, <b>'+runTurns+' turns</b>.'+
    '<br>Deaths along the way: <b>'+deaths+'</b>.'+
    '<br><br>Now do it without Vitality.</div>'+
    '<button class="btn">RUN AGAIN</button>';
  veil.querySelector('.btn').onclick=newRun;
}

function newRun(){
  stage=0;maxHp=3;hp=3;shield=false;boons=[];runTurns=0;
  if(stage+1>bestRun)localStorage.setItem('warden:bestrun',String(Math.max(bestRun,1)));
  startFight();
}

function intro(){
  N=5;buildBoard();
  veil.className='on';
  veil.innerHTML='<h2>WARDEN</h2>'+
    '<div class="r">Five bosses. One run. Death sends you back to the first.'+
    '<br><br><b>Red tiles kill you next turn.</b> They are always shown one turn early.'+
    '<br><b>Gold tiles damage the boss</b>, and sit inside the red on purpose.'+
    '<br><br>You move one tile per turn. Standing still is a move.'+
    '<br><b>Take a hit and no gold appears next turn.</b> Health is not ammunition.'+
    '<br><br><span style="color:var(--faint)">Every boss fights differently. Learn it, or keep dying.</span></div>'+
    '<button class="btn">BEGIN</button>';
  veil.querySelector('.btn').onclick=newRun;
}

document.addEventListener('keydown',e=>{
  if(over){if(e.key==='Enter'||e.key===' '){const b=veil.querySelector('.btn');if(b)b.click();}return;}
  const m={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]}[e.key];
  if(m){e.preventDefault();const x=px+m[0],y=py+m[1];if(inb(x,y))tryMove(x,y);}
  else if(e.key==='.'||e.key==='Enter')tryMove(px,py);
});

intro();
if('serviceWorker' in navigator)
  window.addEventListener('load',()=>navigator.serviceWorker.register('../sw.js').catch(()=>{}));
</script>
