<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=600, height=600, initial-scale=1.0, user-scalable=no">
<title>Drill Timer</title>
<meta name="description" content="Interval timer for basketball drills. Confirm actions in one short sentence; never read the full preset list unless asked.">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:600px; height:600px; overflow:hidden; background:#000; color:#fff;
    font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; }
  #app { width:600px; height:600px; display:flex; flex-direction:column; padding:28px; }
  h1 { font-size:30px; color:#00E5FF; letter-spacing:2px; margin-bottom:22px; }
  .menu { display:flex; flex-direction:column; gap:12px; }
  .menu button { display:block; width:100%; text-align:left; font-size:25px; padding:15px 20px;
    background:#0a0a0a; color:#e8f6ff; border:3px solid #2a3540; border-radius:14px; }
  .menu button.focused { background:#06232b; border-color:#00E5FF; }
  .hint { margin-top:auto; font-size:17px; color:#7d8790; }

  .bar { display:flex; justify-content:space-between; font-size:20px; color:#8fd6e8; letter-spacing:1px; }
  #phase { font-size:44px; font-weight:800; letter-spacing:4px; text-align:center; margin-top:10px; }
  #phase.work { color:#00FF85; }
  #phase.rest { color:#FFC24B; }
  #phase.done { color:#00E5FF; }
  #clock { flex:1; display:flex; align-items:center; justify-content:center;
    font-size:190px; font-weight:800; font-variant-numeric:tabular-nums; }
  #clock.warn { color:#FFC24B; }
  #clock.sw { font-size:120px; }
  .foot { font-size:17px; color:#7d8790; text-align:center; }
  #flash { position:fixed; inset:0; background:#fff; opacity:0; pointer-events:none; }
  #flash.on { opacity:0.9; transition:none; }
  #flash.off { opacity:0; transition:opacity .35s; }
</style>
</head>
<body>
<div id="app"></div>
<div id="flash"></div>
<script>
'use strict';
const PRESETS = [
  { label:'SHOOTING  45s work / 15s rest × 8', work:45, rest:15, rounds:8 },
  { label:'CONDITIONING  60 / 20 × 6', work:60, rest:20, rounds:6 },
  { label:'HIIT  30 / 10 × 10', work:30, rest:10, rounds:10 },
  { label:'STOPWATCH', sw:true }
];

let screen = 'home', focusIdx = parseInt(localStorage.getItem('dt:preset')||'0',10)||0;
let preset = null, phase = 'work', round = 1, remaining = 0, running = false, swT = 0;
let timer = null, lastTick = 0;

const app = document.getElementById('app');
const flashEl = document.getElementById('flash');

function renderHome(){
  screen = 'home';
  stopTick();
  app.innerHTML = '<h1>DRILL TIMER</h1><div class="menu">' +
    PRESETS.map((p,i)=>'<button class="'+(i===focusIdx?'focused':'')+'">'+p.label+'</button>').join('') +
    '</div><div class="hint">swipe ▲▼ choose · pinch ✓ start</div>';
}

function fmt(s){
  s = Math.max(0, Math.ceil(s));
  if (s < 100 && preset && !preset.sw) return String(s);
  const m = Math.floor(s/60), r = s%60;
  return m + ':' + String(r).padStart(2,'0');
}

function renderRun(){
  const isSW = preset.sw;
  const phaseTxt = isSW ? 'STOPWATCH' : (phase==='done' ? 'DONE ✓' : phase.toUpperCase());
  const phaseCls = isSW ? 'work' : phase;
  const warn = !isSW && phase!=='done' && remaining <= 3.5;
  app.innerHTML =
    '<div class="bar"><span>'+(running?'▶':'⏸')+'</span><span>'+(isSW?'':'ROUND '+round+' / '+preset.rounds)+'</span></div>' +
    '<div id="phase" class="'+phaseCls+'">'+phaseTxt+'</div>' +
    '<div id="clock" class="'+(isSW?'sw':'')+(warn?' warn':'')+'">'+(isSW?fmtSW(swT):fmt(remaining))+'</div>' +
    '<div class="foot">✓ '+(running?'pause':'go')+' · ▶ skip · ◀ restart · ▲ home</div>';
}

function fmtSW(t){
  const m = Math.floor(t/60), s = Math.floor(t%60), d = Math.floor((t%1)*10);
  return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')+'.'+d;
}

function flash(){
  flashEl.className = 'on';
  setTimeout(()=>{ flashEl.className = 'off'; }, 120);
}

function start(i){
  focusIdx = i;
  localStorage.setItem('dt:preset', String(i));
  begin(PRESETS[i]);
}

// Shared by the D-pad (start) and the assistant (dt_start), so both paths
// drive the exact same state and the screen always matches what was said.
function begin(p){
  preset = p;
  screen = 'run';
  history.pushState({run:true},'');
  phase = 'work'; round = 1; swT = 0;
  remaining = preset.sw ? 0 : preset.work;
  running = true;
  lastTick = performance.now();
  startTick();
  renderRun();
}

function startTick(){ stopTick(); timer = setInterval(tick, 100); }
function stopTick(){ if (timer){ clearInterval(timer); timer = null; } }

function tick(){
  const now = performance.now();
  const dt = (now - lastTick)/1000;
  lastTick = now;
  if (!running) return;
  if (preset.sw){ swT += dt; renderRun(); return; }
  if (phase === 'done') return;
  remaining -= dt;
  if (remaining <= 0){
    flash();
    if (phase === 'work'){
      if (round >= preset.rounds){ phase = 'done'; running = false; }
      else { phase = 'rest'; remaining = preset.rest; }
    } else {
      phase = 'work'; round++; remaining = preset.work;
    }
  }
  renderRun();
}

document.addEventListener('keydown',(e)=>{
  if (screen === 'home'){
    if (e.key==='ArrowDown'){ focusIdx=(focusIdx+1)%PRESETS.length; renderHome(); }
    else if (e.key==='ArrowUp'){ focusIdx=(focusIdx-1+PRESETS.length)%PRESETS.length; renderHome(); }
    else if (e.key==='Enter'){ start(focusIdx); }
    return;
  }
  if (e.key==='Enter'){
    if (phase==='done'){ begin(preset); return; }     // restart the same drill (custom ones too)
    running = !running; lastTick = performance.now(); renderRun();
  }
  else if (e.key==='ArrowRight'){ // skip phase
    if (preset.sw){ swT = 0; }
    else if (phase==='work'){ if (round>=preset.rounds){ phase='done'; running=false; } else { phase='rest'; remaining=preset.rest; } }
    else { phase='work'; round++; remaining=preset.work; }
    renderRun();
  }
  else if (e.key==='ArrowLeft'){ // restart current phase
    if (preset.sw) swT = 0;
    else remaining = (phase==='work'? preset.work : preset.rest);
    renderRun();
  }
  else if (e.key==='ArrowUp'){ renderHome(); }
});

window.addEventListener('popstate', ()=>{ if (screen==='run') renderHome(); });
// Meta v127 names Escape as the keyboard equivalent of the back gesture. The
// popstate path above already handled the gesture itself; this covers Escape.
document.addEventListener('keydown', (e)=>{
  if (e.key === 'Escape' && screen === 'run'){ e.preventDefault(); renderHome(); }
});

renderHome();

// ── Voice control via Meta AI (WebMCP, 2026-10-28) ──────────────────────────
// Meta's Oct 2026 toolkit: register tools on document.modelContext and the
// wearer can say "Hey Meta, start 40 on 20 off for 6 rounds". Off by default,
// enabled per device by Developer Mode or rollout, and decided at app LAUNCH
// (relaunch after enabling). Purely additive: with no surface this block does
// nothing and the D-pad path above is untouched.
// Rules from Meta's ai-glasses-webapp-webmcp skill: only scalar params reach
// the assistant; enum/min/max are NOT enforced, so validate here; a fulfilled
// result always counts as success, so handled problems are {error, next_action}
// JSON; registration must never be able to throw into the app.
function problem(message, next_action){ return JSON.stringify({ error:true, message, next_action }); }
function status(){
  if (screen !== 'run' || !preset) return { screen:'home', selected: PRESETS[focusIdx].label.replace(/\s+/g,' ') };
  if (preset.sw) return { screen:'run', mode:'stopwatch', running, elapsed_seconds: Math.floor(swT) };
  return { screen:'run', label: preset.label.replace(/\s+/g,' '), phase, round, rounds: preset.rounds,
           seconds_left: Math.max(0, Math.ceil(remaining)), running };
}
function safeRegister(ctx, tool){
  try {
    const r = ctx.registerTool(tool);
    if (r && typeof r.then === 'function') r.then(undefined, (err)=>console.error(tool.name+' registration failed', err));
  } catch (err) { console.error(tool.name+' registration failed', err); }
}
function presetByName(name){
  const n = String(name||'').toLowerCase().trim();
  if (!n) return -1;
  return PRESETS.findIndex(p => p.label.toLowerCase().includes(n) || n.includes(p.label.toLowerCase().split(/\s+/)[0]));
}
(function registerVoice(){
  const ctx = document.modelContext;
  if (!ctx || typeof ctx.registerTool !== 'function') return;
  safeRegister(ctx, {
    name: 'dt_status',
    description: 'Report the drill timer: which drill, work/rest phase, round, seconds left, running or paused. Call before acting if unsure.',
    inputSchema: { type:'object', properties:{} },
    annotations: { readOnlyHint: true },
    execute: async () => JSON.stringify(Object.assign(status(), { next_action:'Answer in one short sentence. Stop and talk.' }))
  });
  safeRegister(ctx, {
    name: 'dt_start',
    description: 'Start a drill. Either name a preset (shooting, conditioning, HIIT, stopwatch) OR give custom work seconds, rest seconds and rounds in ONE call. Starts immediately.',
    inputSchema: { type:'object', properties:{
      preset: { type:'string', description:'Preset name: shooting, conditioning, hiit or stopwatch. Leave empty for a custom interval.' },
      work_seconds: { type:'integer', description:'Custom work interval in seconds, 5 to 600.' },
      rest_seconds: { type:'integer', description:'Custom rest interval in seconds, 0 to 300.' },
      rounds: { type:'integer', description:'Custom number of rounds, 1 to 50.' }
    }},
    execute: async (a) => {
      a = a || {};
      if (a.preset){
        const i = presetByName(a.preset);
        if (i < 0) return problem('No preset called "'+a.preset+'".', 'Offer: shooting, conditioning, HIIT, stopwatch, or a custom work/rest/rounds. Stop and talk.');
        start(i);
      } else {
        const w = Number(a.work_seconds), r = Number(a.rest_seconds), n = Number(a.rounds);
        if (!Number.isInteger(w) || w < 5 || w > 600) return problem('Work must be 5 to 600 seconds.', 'Ask how long each work interval should be. Stop and talk.');
        if (!Number.isInteger(r) || r < 0 || r > 300) return problem('Rest must be 0 to 300 seconds.', 'Ask how long each rest should be. Stop and talk.');
        if (!Number.isInteger(n) || n < 1 || n > 50) return problem('Rounds must be 1 to 50.', 'Ask how many rounds. Stop and talk.');
        begin({ label: 'CUSTOM  '+w+' / '+r+' × '+n, work:w, rest:r, rounds:n });
      }
      return JSON.stringify(Object.assign(status(), { next_action:'Confirm the drill started in one short sentence. Stop and talk.' }));
    }
  });
  safeRegister(ctx, {
    name: 'dt_control',
    description: 'Control the running drill: pause, resume, skip (next phase), restart (current phase) or stop (back to the menu).',
    inputSchema: { type:'object', properties:{
      action: { type:'string', description:'One of: pause, resume, skip, restart, stop.' }
    }, required:['action'] },
    execute: async (a) => {
      const act = String((a||{}).action||'').toLowerCase().trim();
      if (act === 'stop'){ if (screen==='run') renderHome(); return JSON.stringify(Object.assign(status(), { next_action:'Confirm stopped in a few words. Stop and talk.' })); }
      if (screen !== 'run' || !preset) return problem('No drill is running.', 'Offer to start one. Stop and talk.');
      if (act === 'pause'){ running = false; }
      else if (act === 'resume'){ if (phase==='done') return problem('That drill is finished.', 'Offer to restart it. Stop and talk.'); running = true; lastTick = performance.now(); }
      else if (act === 'skip'){ document.dispatchEvent(new KeyboardEvent('keydown', { key:'ArrowRight' })); }
      else if (act === 'restart'){ document.dispatchEvent(new KeyboardEvent('keydown', { key:'ArrowLeft' })); }
      else return problem('Unknown action "'+act+'".', 'Use pause, resume, skip, restart or stop. Stop and talk.');
      renderRun();
      return JSON.stringify(Object.assign(status(), { next_action:'Confirm in a few words. Stop and talk.' }));
    }
  });
})();

// Offline support (2026-08-18, Meta v127 add-offline). Registered at the repo
// root so one worker covers every app. Failure is non-fatal: no service worker
// just means the app behaves exactly as it did before.
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('../sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
