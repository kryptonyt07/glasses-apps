<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=600, height=600, initial-scale=1.0, user-scalable=no">
<title>Line Runner</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:600px; height:600px; overflow:hidden; background:#000; color:#fff;
    font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; }
  #app { width:600px; height:600px; display:flex; flex-direction:column; padding:28px; }

  /* HOME */
  .home h1 { font-size:34px; color:#00E5FF; letter-spacing:1px; margin-bottom:6px; }
  .home .sub { font-size:20px; color:#9aa3ad; margin-bottom:30px; }
  .menu { display:flex; flex-direction:column; gap:14px; }
  .menu button { display:block; width:100%; text-align:left; font-size:26px; padding:16px 20px;
    background:#0a0a0a; color:#e8f6ff; border:3px solid #2a3540; border-radius:14px; }
  .menu button.focused { background:#06232b; border-color:#00E5FF; color:#fff; }
  .hint { margin-top:auto; font-size:17px; color:#7d8790; }

  /* RUN */
  .bar { display:flex; justify-content:space-between; font-size:19px; color:#8fd6e8;
    margin-bottom:16px; letter-spacing:1px; }
  .who { font-size:22px; font-weight:700; letter-spacing:2px; margin-bottom:12px; }
  .who.mine { color:#00E5FF; }
  .who.cue { color:#FFC24B; }
  .who.action { color:#8a939c; font-style:italic; }
  #text { flex:1; font-size:38px; line-height:1.3; font-weight:600; overflow:hidden; }
  #text.cuetext { color:#ffe9c2; font-weight:500; }
  #text.actiontext { color:#aab3bb; font-style:italic; font-weight:400; }
  #text.hidden-line { color:#00E5FF; }
  .foot { font-size:17px; color:#7d8790; margin-top:14px; }
  .part { color:#57616a; font-size:20px; margin-left:8px; font-weight:400; }
  .notice { font-size:18px; color:#FFC24B; margin-bottom:14px; }

  /* PROMPTER */
  #pwin { flex:1; overflow:hidden; position:relative; }
  #pstream { will-change:transform; padding-top:260px; line-height:1.35; font-weight:600; }
  .pchunk { margin-bottom:26px; color:#fff; }
  .pchunk.p-mine { color:#9ef3ff; }
  .pchunk.p-cue { color:#ffe9c2; font-weight:500; }
  .pchunk.p-action { color:#8a939c; font-style:italic; font-weight:400; }
  .plabel { font-size:0.6em; letter-spacing:2px; color:#FFC24B; margin-bottom:2px; }
  .p-mine .plabel { color:#00E5FF; }
  .pend { color:#57616a; text-align:center; padding:40px 0 300px; }
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';
// ---------- data loading ----------
const DEMO = {title:'DEMO — load your sides via editor', me:'YOU',
  chunks:[
    {who:'DIRECTOR', text:'Whenever you are ready. And... action.', mine:false, action:false},
    {who:'YOU', text:'This is Line Runner. Your lines appear in blue.', mine:true, action:false},
    {who:'', text:'She steps closer to the camera.', mine:false, action:true},
    {who:'DIRECTOR', text:'Swipe forward for the next line, back to go back.', mine:false, action:false},
    {who:'YOU', text:'In rehearse mode my line stays hidden until I confirm. That is how I test my memory.', mine:true, action:false}
  ]};

function b64uDecode(s){
  s = s.replace(/-/g,'+').replace(/_/g,'/');
  const bin = atob(s), bytes = new Uint8Array(bin.length);
  for (let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}

let data = null;
let loadError = false;
(function load(){
  let packed = null;
  if (location.hash && location.hash.startsWith('#s=')) packed = location.hash.slice(3);
  if (!packed) packed = new URLSearchParams(location.search).get('s');
  if (packed){
    try {
      data = JSON.parse(b64uDecode(packed));
      localStorage.setItem('lr:last', JSON.stringify(data));
      localStorage.removeItem('lr:pos');
    } catch(e){ loadError = true; }
  }
  if (!data){
    try { data = JSON.parse(localStorage.getItem('lr:last')); } catch(e){}
  }
  if (!data || !Array.isArray(data.chunks) || !data.chunks.length) data = DEMO;
})();

// ---------- state ----------
let screen = 'home';       // 'home' | 'run'
let mode = 'read';         // 'read' | 'rehearse' | 'prompt'
let pos = 0;
let revealed = false;
let focusIdx = 0;
const savedPos = parseInt(localStorage.getItem('lr:pos') || '0', 10) || 0;

// text size (S/M/L) — the on-face legibility knob
const SIZES = ['S','M','L'], FACTORS = {S:0.85, M:1, L:1.2};
let sizeLabel = localStorage.getItem('lr:size') || 'M';
if (!FACTORS[sizeLabel]) sizeLabel = 'M';
function sizeFactor(){ return FACTORS[sizeLabel]; }

// prompter state
let raf = null, py = 0, paused = false, lastT = 0;
let pspeed = parseFloat(localStorage.getItem('lr:pspeed') || '40');
if (!(pspeed >= 10 && pspeed <= 120)) pspeed = 40;
function cancelRaf(){ if (raf){ cancelAnimationFrame(raf); raf = null; } }

const app = document.getElementById('app');

// ---------- home ----------
function homeItems(){
  const items = [];
  if (savedPos > 0 && savedPos < data.chunks.length)
    items.push({label:'Resume at line ' + (savedPos+1), act:()=>start(localStorage.getItem('lr:mode')||'read', savedPos)});
  items.push({label:'Read mode', act:()=>start('read',0)});
  items.push({label:'Rehearse mode  (lines hidden)', act:()=>start('rehearse',0)});
  items.push({label:'Prompter mode  (auto-scroll)', act:()=>start('prompt',0)});
  items.push({label:'Text size: ' + sizeLabel, act:()=>{
    sizeLabel = SIZES[(SIZES.indexOf(sizeLabel)+1) % SIZES.length];
    localStorage.setItem('lr:size', sizeLabel);
    renderHome();
  }});
  return items;
}

function renderHome(){
  const items = homeItems();
  if (focusIdx >= items.length) focusIdx = 0;
  app.innerHTML =
    '<div class="home" style="display:flex;flex-direction:column;height:100%">' +
    '<h1>LINE RUNNER</h1>' +
    '<div class="sub">' + esc(data.title || 'Untitled') + ' · ' + data.chunks.length + ' beats · you are ' + esc(data.me || '?') + '</div>' +
    (loadError ? '<div class="notice">⚠ link script failed to load — showing last saved</div>' : '') +
    '<div class="menu">' +
    items.map((it,i)=>'<button class="focusable'+(i===focusIdx?' focused':'')+'">'+esc(it.label)+'</button>').join('') +
    '</div>' +
    '<div class="hint">swipe ▲▼ choose · pinch ✓ select</div>' +
    '</div>';
}

function start(m, p){
  mode = m; pos = p; revealed = (mode==='read');
  localStorage.setItem('lr:mode', mode);
  history.pushState({run:true}, '');   // Escape/back returns to home instead of exiting
  screen = 'run';
  render();
}

// ---------- run ----------
function renderRun(){
  const c = data.chunks[pos];
  const total = data.chunks.length;
  const hideMine = (mode==='rehearse' && c.mine && !revealed);
  let whoClass = c.action ? 'action' : (c.mine ? 'mine' : 'cue');
  let whoLabel = c.action ? '— action —' : esc(c.who || '');
  if (c.mine) whoLabel += ' (YOU)';
  const part = c.part ? '<span class="part">'+esc(c.part)+'</span>' : '';
  const textClass = c.action ? 'actiontext' : (c.mine ? (hideMine?'hidden-line':'') : 'cuetext');
  const body = hideMine ? '● ● ●&nbsp;&nbsp;pinch ✓ to reveal' : esc(c.text);

  app.innerHTML =
    '<div class="bar"><span>'+(mode==='rehearse'?'REHEARSE':'READ')+'</span><span>'+(pos+1)+' / '+total+'</span></div>' +
    '<div class="who '+whoClass+'">'+whoLabel+part+'</div>' +
    '<div id="text" class="'+textClass+'">'+body+'</div>' +
    '<div class="foot">◀ back · ▶ next' + (mode==='rehearse' ? ' · ✓ reveal' : '') + '</div>';

  fitText();
  localStorage.setItem('lr:pos', String(pos));
}

function fitText(){
  const el = document.getElementById('text');
  if (!el) return;
  const f = sizeFactor();
  let size = Math.round(38 * f);
  const min = Math.round(20 * f);
  el.style.fontSize = size + 'px';
  while (el.scrollHeight > el.clientHeight && size > min){
    size -= 2;
    el.style.fontSize = size + 'px';
  }
}

// ---------- prompter ----------
function renderPrompt(){
  app.innerHTML =
    '<div class="bar"><span id="pmode">PROMPT</span><span id="pspd">' + Math.round(pspeed) + ' px/s</span></div>' +
    '<div id="pwin"><div id="pstream">' +
    data.chunks.map(c=>{
      const cls = c.action ? 'p-action' : (c.mine ? 'p-mine' : 'p-cue');
      const label = (c.who && !c.action) ? '<div class="plabel">'+esc(c.who)+(c.mine?' (YOU)':'')+'</div>' : '';
      return '<div class="pchunk '+cls+'">'+label+esc(c.text)+'</div>';
    }).join('') +
    '<div class="pend">— END · ✓ to restart —</div></div></div>' +
    '<div class="foot">✓ pause/go · ▲▼ speed · ◀▶ jump</div>';
  document.getElementById('pstream').style.fontSize = Math.round(30 * sizeFactor()) + 'px';
  py = 0; lastT = 0; paused = false;
  cancelRaf();
  raf = requestAnimationFrame(pstep);
}

function pstep(t){
  const stream = document.getElementById('pstream');
  if (!stream){ cancelRaf(); return; }
  if (!lastT) lastT = t;
  const dt = Math.min((t - lastT) / 1000, 0.1);
  lastT = t;
  if (!paused) py += pspeed * dt;
  const max = Math.max(0, stream.scrollHeight - stream.parentElement.clientHeight);
  if (py >= max){ py = max; if (!paused){ paused = true; setPmode(); } }
  if (py < 0) py = 0;
  stream.style.transform = 'translateY(' + (-py) + 'px)';
  raf = requestAnimationFrame(pstep);
}

function setPmode(){
  const el = document.getElementById('pmode');
  if (el) el.textContent = 'PROMPT' + (paused ? ' ⏸' : '');
}

// ---------- shared ----------
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function render(){
  if (screen === 'home') renderHome();
  else if (mode === 'prompt') renderPrompt();
  else renderRun();
}

function next(){
  if (pos < data.chunks.length - 1){ pos++; revealed = (mode==='read'); render(); }
}
function prev(){
  if (pos > 0){ pos--; revealed = (mode==='read'); render(); }
}
function goHome(){ cancelRaf(); screen='home'; focusIdx=0; render(); }

document.addEventListener('keydown', (e)=>{
  if (screen === 'home'){
    const items = homeItems();
    if (e.key==='ArrowDown'){ focusIdx = (focusIdx+1)%items.length; renderHome(); }
    else if (e.key==='ArrowUp'){ focusIdx = (focusIdx-1+items.length)%items.length; renderHome(); }
    else if (e.key==='Enter'){ items[focusIdx].act(); }
    return;
  }
  // prompter screen
  if (mode === 'prompt'){
    if (e.key==='Enter'){
      const stream = document.getElementById('pstream');
      const max = stream ? Math.max(0, stream.scrollHeight - stream.parentElement.clientHeight) : 0;
      if (paused && py >= max && max > 0){ py = 0; lastT = 0; }  // restart from END
      paused = !paused; setPmode();
    }
    else if (e.key==='ArrowUp'){ pspeed = Math.min(120, pspeed + 10); }
    else if (e.key==='ArrowDown'){ pspeed = Math.max(10, pspeed - 10); }
    else if (e.key==='ArrowRight'){ py += 400; }
    else if (e.key==='ArrowLeft'){ py = Math.max(0, py - 400); }
    const spd = document.getElementById('pspd');
    if (spd) spd.textContent = Math.round(pspeed) + ' px/s';
    localStorage.setItem('lr:pspeed', String(pspeed));
    return;
  }
  // run screen
  if (e.key==='ArrowRight' || e.key==='ArrowDown'){ next(); }
  else if (e.key==='ArrowLeft' || e.key==='ArrowUp'){ prev(); }
  else if (e.key==='Enter'){
    const c = data.chunks[pos];
    if (mode==='rehearse' && c.mine && !revealed){ revealed = true; render(); }
    else next();
  }
});

window.addEventListener('popstate', ()=>{ if (screen==='run') goHome(); });

render();
</script>
</body>
</html>
